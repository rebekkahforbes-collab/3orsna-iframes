<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
/*@@FONTS@@*/
<style>
/* ── Pixel Pals build standards ─────────────────────────────────────
   No visible scrollbars anywhere (everything still scrolls), media never
   wider than its box, 16px form text on phones so iOS doesn't zoom.
   Height: the reporter at the end of this file (setHeight → site-wide listener). */
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0;height:0;display:none}
img,video,canvas{max-width:100%}
@media (max-width:760px){input,select,textarea{font-size:16px!important}}

/* Generated by tools/build-invite.py — edit the builder or this
   template, not the generated file. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{overflow-x:hidden}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.skeleton{min-height:560px;display:grid;place-items:center;background:#14110C;color:rgba(243,234,218,.6);
  font-family:'Cormorant Garamond',serif;font-size:20px;letter-spacing:.14em}

/*@@INV_CSS@@*/

/* guest-page only */
/*@@IMG_RULE@@*/
.inv .bord.corner i .mask{display:block;width:100%;height:100%;background:currentColor;
  -webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:top left;mask-position:top left}
.inv[dir=rtl] .bord.corner i .mask{-webkit-mask-position:top left;mask-position:top left}
.inv .preview-bar{position:relative;z-index:30;background:#BD9B68;color:#17130A;text-align:center;
  font:600 13px/1.5 'Montserrat',system-ui,sans-serif;padding:10px 16px}
.inv[dir=rtl] .preview-bar{font-family:'Tajawal',system-ui,sans-serif;font-size:14px}
.inv .rsvp[inert]{opacity:.55}
.inv .hello{font-family:var(--disp);font-style:italic;font-weight:500;font-size:clamp(17px,4cqi,22px);
  color:var(--mu);margin:0 auto 6px}
.inv[dir=rtl] .hello{font-family:var(--arb);font-style:normal}

/* Safety space at the end of the invitation, in the invitation's own colour,
   so nothing is cut off and nothing shows through. */
.inv{padding-bottom:140px}
@media (max-width:760px){.inv{padding-bottom:calc(180px + env(safe-area-inset-bottom, 0px))}}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
</style>
</head>
<body>
<div class="inv" id="inv"><div class="skeleton" id="boot">…</div></div>

<script>
"use strict";

let cfg = null;                 // the wedding, from the router
const OWN_ART = () => (cfg && cfg.ownArtworkUrl) || "";   // the couple's own uploaded design, if they chose one
let lang = "en";
let attending = null;
let sending = false, sent = false;
let tick = null;
/* Inside a self-resizing Wix iframe, 100vh is the iframe's own height,
   so the page sends the real window height. Until then, a sensible guess. */
let viewportH = (window.self === window.top) ? window.innerHeight : 820;

/* ═══ copied from the builder by tools/build-invite.py ═══ */
/*@@SHARED_JS@@*/
/* ═══ end of copied code ═══ */

const $ = s => document.querySelector(s);
const inv = $("#inv");
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cssUrl = u => String(u||"").replace(/['"()\s<>\\]/g, "");          // for url('…') inside style attributes

/* Height: the Pixel Pals reporter at the end of this file (setHeight → site-wide listener). */

/* ═══ ornaments: only the one this wedding uses is fetched ═══ */
const ORN_CACHE = {};
function loadOrnament(key){
  const b = BORDERS[key];
  if (!b || !b.url || key in ORN_CACHE) return;
  ORN_CACHE[key] = null;
  fetch(b.url, {mode:"cors"})
    .then(r => r.ok ? r.text() : Promise.reject(new Error("HTTP "+r.status)))
    .then(t => { ORN_CACHE[key] = prepareSvg(t, key); })
    .catch(() => { ORN_CACHE[key] = ""; })
    .finally(() => render());
}
function ornHtml(key){
  if (key === "custom"){
    /* A couple's own upload is drawn through a CSS mask: it takes the text
       colour, and an SVG used as a mask can't run any script inside it. */
    const svg = cfg.customBorder && cfg.customBorder.svg;
    if (!svg) return "";
    const u = `url('data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg).replace(/'/g,"%27")}')`;
    return `<span class="mask" style="-webkit-mask-image:${u};mask-image:${u}"></span>`;
  }
  const b = BORDERS[key];
  if (b && b.url){
    const c = ORN_CACHE[key];
    if (c) return c;
    if (c === "") return `<img src="${esc(b.url)}" alt="">`;
    return "";
  }
  return VEC[key] || "";
}

/* ═══ dates ═══ */
const LOC = l => l==="ar" ? "ar-JO" : "en-GB";
function fmtDate(iso, l){ if(!iso) return ""; const d=new Date(iso+"T12:00:00"); if(isNaN(d)) return "";
  return d.toLocaleDateString(LOC(l),{weekday:"long",day:"numeric",month:"long",year:"numeric"}); }
function fmtTime(t, l){ if(!t) return ""; const d=new Date(`2000-01-01T${t}:00`); if(isNaN(d)) return t;
  return d.toLocaleTimeString(LOC(l),{hour:"numeric",minute:"2-digit",hour12:true}); }
function countdown(){
  if (!cfg.date) return null;
  const t = new Date(`${cfg.date}T${cfg.time||"19:00"}:00`); if (isNaN(t)) return null;
  let ms = t - Date.now(); if (ms <= 0) return {past:true};
  const days=Math.floor(ms/86400000); ms-=days*86400000;
  const hours=Math.floor(ms/3600000); ms-=hours*3600000;
  return {past:false, days, hours, mins:Math.floor(ms/60000)};
}
function icsHref(){
  if (!cfg.date) return "";
  const pad = n => String(n).padStart(2,"0");
  const start = new Date(`${cfg.date}T${cfg.time||"19:00"}:00`); if (isNaN(start)) return "";
  const end = new Date(start.getTime() + 5*3600000);
  const z = d => `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}00Z`;
  const icsEsc = s => String(s||"").replace(/[\\,;]/g, m => "\\"+m).replace(/\n/g," ");
  const names = [cfg.bride||cfg.brideAr, cfg.groom||cfg.groomAr].filter(Boolean).join(" & ");
  const where = [cfg.venue, cfg.address, cfg.city].filter(Boolean).join(", ");
  const body = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//invite//EN","BEGIN:VEVENT",
    `UID:${cfg.slug||"wedding"}@invite`, `DTSTAMP:${z(new Date())}`, `DTSTART:${z(start)}`, `DTEND:${z(end)}`,
    `SUMMARY:${icsEsc(names||"Wedding")}`, `LOCATION:${icsEsc(where)}`, "END:VEVENT","END:VCALENDAR"].join("\r\n");
  return "data:text/calendar;charset=utf-8," + encodeURIComponent(body);
}

/* ═══ words ═══ */
function words(l){
  return l==="ar" ? {
    pre:"يسرّنا دعوتكم لحضور زفاف", days:"يوم", hours:"ساعة", mins:"دقيقة", married:"تزوجنا في",
    gallery:"لحظاتنا", dress:"اللباس", dir:"الاتجاهات", cal:"أضيفوا إلى التقويم", tbc:"التاريخ قريباً",
    rsvpH:"أكّدوا حضوركم", name:"الاسم الكامل", phone:"رقم الهاتف", count:"عدد الحضور", msg:"رسالة للعروسين",
    yes:"سأحضر", no:"أعتذر", send:"إرسال الرد", sending:"جارٍ الإرسال…", by:"يرجى الرد قبل",
    hello:n=>`أهلاً ${n}`, thanksYes:"شكراً لكم", thanksNo:"سنفتقدكم",
    bodyYes:"سجّلنا حضوركم. نراكم قريباً.", bodyNo:"شكراً لإعلامنا. ستكونون في قلوبنا.", again:"تعديل الرد",
    errName:"من فضلك اكتبوا اسمكم", errPick:"من فضلك اختاروا إن كنتم ستحضرون",
    errSend:"تعذّر الإرسال. حاولوا مرة أخرى.", closed:"انتهى موعد الرد",
    preview:"معاينة — أنتم فقط ترون هذه الصفحة. انشروها من لوحة التحكم لمشاركتها.",
    previewForm:"الردود تعمل بعد نشر الصفحة."
  } : {
    pre:"With joy, we invite you to the wedding of", days:"Days", hours:"Hours", mins:"Minutes", married:"Married on",
    gallery:"Our moments", dress:"Dress code", dir:"Get directions", cal:"Add to calendar", tbc:"Date to come",
    rsvpH:"Will you be there?", name:"Full name", phone:"Phone number", count:"How many of you", msg:"A note for us",
    yes:"I'll be there", no:"Sadly, no", send:"Send reply", sending:"Sending…", by:"Kindly reply by",
    hello:n=>`Dear ${n}`, thanksYes:"Thank you", thanksNo:"We'll miss you",
    bodyYes:"Your reply is in. We can't wait to see you.", bodyNo:"Thank you for letting us know. You'll be with us in spirit.",
    again:"Change my reply", errName:"Please enter your name", errPick:"Please choose whether you can come",
    errSend:"That didn't send. Please try again.", closed:"Replies are closed",
    preview:"Preview — only you can see this page. Publish it from your dashboard to share it.",
    previewForm:"Replies work once the page is published."
  };
}

/* ═══ render — mirrors the builder's preview, with a working form ═══ */
function render(){
  if (!cfg) return;
  const l = lang, rtl = l==="ar", W = words(l);
  const s = cfg.style || "colour";
  const fg = cfg.textColour || "#F4EDE2";
  const bg = cfg.bgColour || "#14110C";

  inv.dir = rtl ? "rtl" : "ltr";
  document.documentElement.lang = l;
  const bgBase = s==="photo" ? "#1A1A1A" : bg;
  inv.style.cssText = `--bg:${bgBase};--fg:${fg};--ac:${fg};--mu:${rgba(fg,.86)};--ln:${rgba(fg,.42)};--heart:${HEART};--vh:${viewportH}px;`;

  const A = (rtl ? (cfg.brideAr||cfg.bride) : (cfg.bride||cfg.brideAr)) || "";
  const B = (rtl ? (cfg.groomAr||cfg.groom) : (cfg.groom||cfg.groomAr)) || "";
  const joiner = rtl ? "و" : "&";
  /* Old stock photos (Unsplash) no longer exist — treat them as no photo. */
  const photo = /images\.unsplash\.com/.test(cfg.coverUrl||"") ? "" : cssUrl(cfg.coverUrl);

  let layer="", fade="";
  if (s==="colour"){
    const g = (FADES[cfg.fade]||FADES.none).css(bg);
    fade = `<div class="fade" style="background:${g==="none"?bg:g}"></div>`;
  } else if (s==="artwork"){
    const art = artById(cfg.artwork);
    layer = `<div class="lw"><div class="layer art${art.edges==="repeat"?" rep":""}" style="border-image-source:url('${cssUrl(artUrl(art))}');border-image-slice:${artSlice(art)}"></div></div>`;
  } else if (s==="photo"){
    if (photo) layer = `<div class="layer" style="background-image:url('${photo}')"></div>`;
    const oc = cfg.overlayColour, v = (OVERLAYS[cfg.overlay]||OVERLAYS.medium).v;
    if (oc && v) fade = `<div class="fade" style="background:linear-gradient(180deg,${rgba(oc,v*.62)},${rgba(oc,v)} 58%,${rgba(oc,Math.min(1,v*1.25))})"></div>`;
  }

  let bord = "";
  if ((s==="colour" || s==="photo") && cfg.border && cfg.border!=="none"){
    const def = BORDERS[cfg.border];
    if (def && def.kind==="frame") bord = `<div class="bord bd-${cfg.border}"></div>`;
    else {
      loadOrnament(cfg.border);
      const o = ornHtml(cfg.border);
      if (o) bord = `<div class="bord corner"><i class="a">${o}</i><i class="b">${o}</i></div>`;
    }
  }

  /* Optional on every style: the couple's own photo, in their chosen shape. */
  const couple = cssUrl(cfg.couplePhotoUrl);
  const portrait = couple ? `<div class="port ${cfg.shape||"circle"}" style="background-image:url('${couple}')"></div>` : "";
  const tag   = rtl ? (cfg.taglineAr||cfg.tagline) : (cfg.tagline||cfg.taglineAr);
  const lift  = s==="photo" ? (lum(fg) > .45 ? " lift-dark" : " lift-light") : "";
  const isDesign = s==="artwork";
  const stage = isDesign ? `<div class="stage-bg" style="background-image:url('${cssUrl(artUrl(artById(cfg.artwork)))}')"></div>` : "";
  const heroBg = isDesign ? ` style="background:${darken(bg,.12)}"` : "";
  const cardBg = isDesign ? ` style="background:${bg}"` : "";
  const ics = icsHref();
  const hello = cfg.guest && cfg.guest.name ? `<p class="hello">${esc(W.hello(cfg.guest.name))}</p>` : "";

  let html = cfg.preview ? `<div class="preview-bar">${W.preview}</div>` : "";
  html += `<div class="hero s-${s}${lift}"${heroBg}>${stage}<div class="card"${cardBg}>
    ${layer}${fade}${bord}
    <div class="body">
      ${portrait}${hello}
      <p class="pre">${W.pre}</p>
      <h1 class="names">${esc(A)}<span class="j">${joiner}</span>${esc(B)}</h1>
      ${tag?`<p class="tag">${esc(tag)}</p>`:""}
      <div class="rule"></div>
      <p class="when">${fmtDate(cfg.date,l)||W.tbc}${cfg.time?`${rtl?"، الساعة ":" · "}${fmtTime(cfg.time,l)}`:""}</p>
      ${(cfg.venue||cfg.city||cfg.address)?`<p class="where">
        ${cfg.venue?`<b>${esc(cfg.venue)}</b>`:""}
        ${cfg.address?esc(cfg.address)+"<br>":""}${esc(cfg.city||"")}</p>`:""}
      ${cfg.dress?`<p class="where"><small>${W.dress}: ${esc(cfg.dress)}</small></p>`:""}
      <div class="acts">
        ${cfg.mapUrl?`<a class="act" href="${esc(cfg.mapUrl)}" target="_blank" rel="noopener noreferrer">${W.dir}</a>`:""}
        ${ics?`<a class="act" href="${ics}" download="wedding.ics">${W.cal}</a>`:""}
      </div>
    </div></div></div><div class="after">`;

  const cd = countdown();
  if (cd && cd.past) html += `<div class="married"><b>${W.married} ${fmtDate(cfg.date,l)}</b></div>`;
  else if (cd) html += `<div class="cd"><div class="cdi">
      <div class="u"><b>${cd.days}</b><span>${W.days}</span></div>
      <div class="u"><b>${String(cd.hours).padStart(2,"0")}</b><span>${W.hours}</span></div>
      <div class="u"><b>${String(cd.mins).padStart(2,"0")}</b><span>${W.mins}</span></div></div></div>`;

  const gal = (cfg.galleryUrls||[]).filter(Boolean);
  if (gal.length) html += `<section><h3>${W.gallery}</h3><div class="gal">${gal.slice(0,6).map(u=>`<img src="${esc(u)}" alt="" loading="lazy">`).join("")}</div></section>`;

  const r = cfg.rsvp || {};
  if (r.on){
    const closed = r.deadline && new Date(r.deadline+"T23:59:59") < new Date();
    html += `<section id="rsvp"><h3>${W.rsvpH}</h3>${
      sent ? doneBlock(W) : closed ? `<p class="deadline">${W.closed}</p>` : formBlock(W, r, l)}</section>`;
  }
  html += `<div class="foot">${esc([A,B].filter(Boolean).join(` ${joiner} `))}</div></div>`;

  /* keep anything half-typed across re-renders (language switch, ornament arriving) */
  const keep = {};
  ["g-name","g-phone","g-count","g-msg"].forEach(id=>{ const el=document.getElementById(id); if (el) keep[id]=el.value; });
  inv.innerHTML = html;
  Object.entries(keep).forEach(([id,v])=>{ const el=document.getElementById(id); if (el) el.value=v; });

  if (cfg.invLang === "both") mountLangToggle();
  wireForm();
 
}

function formBlock(W, r, l){
  const max = Math.max(1, Math.min(20, r.max||4));
  const opts = Array.from({length:max},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join("");
  const known = cfg.guest && cfg.guest.name;
  return `<form class="rsvp" id="rsvpForm" novalidate${cfg.preview?" inert":""}>
    <label for="g-name">${W.name}</label><input class="ipt" id="g-name" type="text" autocomplete="name" required value="${esc(known||"")}">
    ${r.phone && !known ? `<label for="g-phone">${W.phone}</label><input class="ipt" id="g-phone" type="tel" autocomplete="tel" inputmode="tel">` : ""}
    ${r.count ? `<label for="g-count">${W.count}</label><select class="ipt" id="g-count">${opts}</select>` : ""}
    ${r.msg ? `<label for="g-msg">${W.msg}</label><textarea class="ipt" id="g-msg" rows="2" maxlength="400"></textarea>` : ""}
    <div class="yn">
      <button type="button" id="g-yes" aria-pressed="${attending===true}">${W.yes}</button>
      <button type="button" id="g-no" aria-pressed="${attending===false}">${W.no}</button>
    </div>
    <button type="submit" class="send" id="g-send"${sending?" disabled":""}>${sending?W.sending:W.send}</button>
    <p class="err" id="g-err" role="alert">${cfg.preview ? W.previewForm : ""}</p>
    ${r.deadline?`<p class="deadline">${W.by} ${fmtDate(r.deadline,l)}</p>`:""}
  </form>`;
}
function doneBlock(W){
  return `<div class="done"><b>${attending?W.thanksYes:W.thanksNo}</b><p>${attending?W.bodyYes:W.bodyNo}</p>
    <button type="button" id="g-again">${W.again}</button></div>`;
}
function mountLangToggle(){
  const b = document.createElement("button");
  b.className = "langbtn"; b.type = "button";
  b.textContent = lang==="ar" ? "English" : "العربية";
  b.onclick = ()=>{ lang = lang==="ar" ? "en" : "ar"; render(); };
  inv.appendChild(b);
}
function wireForm(){
  const again = document.getElementById("g-again");
  if (again) again.onclick = ()=>{ sent=false; attending=null; render(); };
  const form = document.getElementById("rsvpForm"); if (!form || cfg.preview) return;
  const W = words(lang), err = document.getElementById("g-err");
  const paint = ()=>{ document.getElementById("g-yes").setAttribute("aria-pressed", attending===true);
                      document.getElementById("g-no").setAttribute("aria-pressed", attending===false); err.textContent=""; };
  document.getElementById("g-yes").onclick = ()=>{ attending=true;  paint(); };
  document.getElementById("g-no").onclick  = ()=>{ attending=false; paint(); };
  form.onsubmit = e=>{
    e.preventDefault();
    if (sending) return;
    const name = (document.getElementById("g-name").value||"").trim();
    if (name.length < 2){ err.textContent = W.errName; document.getElementById("g-name").focus(); return; }
    if (attending === null){ err.textContent = W.errPick; return; }
    const val = id => { const el=document.getElementById(id); return el ? (el.value||"").trim() : ""; };
    const data = { guestName:name, attending, partySize: attending ? (+val("g-count")||1) : 0,
                   phone: val("g-phone"), message: val("g-msg"), lang };
    sending = true; render();
    try{ window.parent.postMessage({type:"3orsna:rsvp", data}, "*"); }catch(e){ sending=false; render(); }
    clearTimeout(window.__rsvpTimer);
    window.__rsvpTimer = setTimeout(()=>{            // never leave a guest staring at "Sending…"
      if (!sending) return; sending=false; render();
      const e2=document.getElementById("g-err"); if (e2) e2.textContent = words(lang).errSend;
    }, 15000);
  };
}
/* Tick the numbers only — re-rendering would wipe a half-typed reply. */
function updateCountdown(){
  if (!cfg) return;
  const cd = countdown(), box = inv.querySelector(".cd");
  if (!cd) return;
  if (cd.past){ if (!inv.querySelector("#rsvpForm")) render(); return; }
  if (!box) return;
  const b = box.querySelectorAll(".u b");
  if (b.length === 3){ b[0].textContent=cd.days; b[1].textContent=String(cd.hours).padStart(2,"0"); b[2].textContent=String(cd.mins).padStart(2,"0"); }
}

/* ═══ messages from the Wix page ═══ */
window.addEventListener("message", e=>{
  const d = e.data; if (!d || typeof d !== "object") return;
  if (d.type === "3orsna:invite" && d.data){
    cfg = d.data;
    lang = cfg.invLang === "ar" ? "ar" : "en";
    const bt = document.getElementById("boot"); if (bt) bt.remove();
    render(); loadArtworkSizes();
    clearInterval(tick); tick = setInterval(updateCountdown, 30000);
  }
  if (d.type === "3orsna:viewport" && +d.height > 0){
    viewportH = Math.max(560, Math.min(1400, Math.round(+d.height)));
    inv.style.setProperty("--vh", viewportH+"px");
  }
  if (d.type === "3orsna:rsvpDone"){ clearTimeout(window.__rsvpTimer); sending=false; sent=true; render(); }
  if (d.type === "3orsna:rsvpFailed"){
    clearTimeout(window.__rsvpTimer); sending=false; render();
    const W = words(lang), err = document.getElementById("g-err");
    if (err) err.textContent = d.reason==="closed" ? W.closed : d.reason==="preview" ? W.previewForm : W.errSend;
  }
});
if (window.self === window.top) window.addEventListener("resize", ()=>{ viewportH=window.innerHeight; inv.style.setProperty("--vh", viewportH+"px"); });

/* Say "ready" every second until the page answers — the page's listener may
   attach after this iframe loads, and a single message would be lost. */
let __answered = false;
window.addEventListener("message", e => { if (e.data && e.data.type === "3orsna:invite") __answered = true; });
(function ping(n){
  if (__answered) return;
  try{ window.parent.postMessage({type:"3orsna:inviteReady"}, "*"); }catch(e){}
  if (n < 30) setTimeout(() => ping(n + 1), 1000);
})(0);

</script>
<!-- Pixel Pals iframe auto-height reporter v3 (body is the scroll box).
     Scrolls inside the iframe until the site-wide listener sizes it.
     Once the site-wide listener sizes the iframe, there is nothing left to scroll. -->
<script>
(function () {
  if (window.__ppReporter) return;
  window.__ppReporter = true;

  var s = document.createElement('style');
  s.textContent =
    'html{height:100%!important;min-height:0!important;overflow:hidden!important}' +
    'body{height:100%!important;min-height:0!important;margin:0;overflow-x:hidden!important;overflow-y:auto!important;' +
      '-webkit-overflow-scrolling:touch;overscroll-behavior:auto;scrollbar-width:none;-ms-overflow-style:none;display:flow-root}' +
    'html::-webkit-scrollbar,body::-webkit-scrollbar{width:0;height:0;display:none}';
  document.head.appendChild(s);

  var body = document.body, last = -1, raf = 0;

  // Height of the content itself, not the scroll box (so the iframe can shrink as well as grow)
  function measure() {
    var top = body.getBoundingClientRect().top - body.scrollTop;
    var bottom = 0, kids = body.children;
    for (var i = 0; i < kids.length; i++) {
      var r = kids[i].getBoundingClientRect();
      if (!r.height && !r.width) continue; // hidden, scripts, styles
      var mb = parseFloat(getComputedStyle(kids[i]).marginBottom) || 0;
      bottom = Math.max(bottom, r.bottom + mb);
    }
    var pb = parseFloat(getComputedStyle(body).paddingBottom) || 0;
    return Math.ceil(bottom - top + pb);
  }

  function send(force) {
    var h = measure();
    if (!force && h === last) return;
    last = h;
    window.parent.postMessage({ type: 'setHeight', height: h }, '*');
  }

  function schedule() {
    if (raf) return;
    raf = requestAnimationFrame(function () { raf = 0; send(false); });
  }

  // Watch the content (the body itself is now a fixed-size scroll box)
  var ro = 'ResizeObserver' in window ? new ResizeObserver(schedule) : null;
  function watchKids() {
    if (!ro) return;
    ro.observe(body);
    for (var i = 0; i < body.children.length; i++) ro.observe(body.children[i]);
  }
  watchKids();
  if ('MutationObserver' in window) {
    new MutationObserver(function () { watchKids(); schedule(); })
      .observe(body, { childList: true, subtree: true, attributes: true, characterData: true });
  }
  window.addEventListener('resize', schedule);
  window.addEventListener('load', function () { send(true); });
  document.addEventListener('load', schedule, true);
  document.addEventListener('transitionend', schedule, true);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { send(true); });

  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'requestHeight') send(true);
  });

  [0, 300, 1000, 2500, 5000].forEach(function (t) { setTimeout(function () { send(true); }, t); });
})();
</script>
</body>
</html>
