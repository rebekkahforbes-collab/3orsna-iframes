<style>
/* ── Pixel Pals build standards ─────────────────────────────────────
   No visible scrollbars anywhere (everything still scrolls), media never
   wider than its box, 16px form text on phones so iOS doesn't zoom.
   Height: the reporter at the end of this file (setHeight → site-wide listener). */
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0;height:0;display:none}
img,video,canvas{max-width:100%}
@media (max-width:760px){input,select,textarea{font-size:16px!important}}

:root{
  --ink:#14161A; --panel:#1C1F25; --panel-2:#232730; --line:#2A2E36; --line-soft:#22252C;
  --text:#E8E6E1; --dim:#9298A3; --dimmer:#6B7280;
  --gold:#BD9B68; --gold-hi:#CDB184; --gold-soft:rgba(189,155,104,.15);
  --ok:#7FB496; --ok-soft:rgba(127,180,150,.14); --no:#D9736B; --no-soft:rgba(217,115,107,.13);
  --wa:#4FB57A; --r:12px;
  --ui:'Manrope',system-ui,-apple-system,sans-serif; --ui-ar:'IBM Plex Sans Arabic','Manrope',sans-serif;
  --disp:'Cormorant Garamond',Georgia,serif; --disp-ar:'Amiri',serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--text);font:14px/1.5 var(--ui);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body[dir=rtl]{font-family:var(--ui-ar)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:1120px;margin:0 auto;padding:22px 20px 36px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font:600 clamp(28px,4vw,38px)/1.1 var(--disp);margin:0;flex:1;min-width:200px}
body[dir=rtl] .top h1{font-family:var(--disp-ar);font-weight:700}
.top p{margin:4px 0 0;color:var(--dim);font-size:13.5px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--panel);
  padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13px;min-height:40px;transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover:not([disabled]){background:var(--panel-2);border-color:#353A44}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#17130A}
.btn.primary:hover:not([disabled]){background:var(--gold-hi);border-color:var(--gold-hi)}
.btn.wa{background:rgba(79,181,122,.14);border-color:rgba(79,181,122,.45);color:#B8E6CA}
.btn.wa:hover:not([disabled]){background:rgba(79,181,122,.22)}
.btn.ghost{background:transparent}
.btn.danger{border-color:rgba(217,115,107,.45);color:#F0B8B2;background:var(--no-soft)}
.btn.sm{padding:6px 10px;min-height:34px;font-size:12.5px}
.btn.icon{padding:0;width:36px;min-height:36px}
.btn svg{width:16px;height:16px;flex:none}

.banner{padding:12px 14px;border-radius:10px;margin:0 0 14px;font-size:13.5px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner span{flex:1;min-width:200px}
.banner.warn{background:var(--gold-soft);border:1px solid rgba(189,155,104,.4);color:#EBD9BB}
.banner.bad{background:var(--no-soft);border:1px solid rgba(217,115,107,.35);color:#F0B8B2}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.add{display:grid;grid-template-columns:1.2fr 1fr auto;gap:10px;align-items:start}
@media(max-width:640px){.add{grid-template-columns:1fr}}
.fld label{display:block;font-size:12.5px;color:var(--dim);font-weight:500;margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:40px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--gold)}
.fld input.bad{border-color:var(--no)}
.fld .hint{font-size:12px;color:var(--dimmer);margin-top:5px}
.fld .errtxt{font-size:12.5px;color:#F0B8B2;margin-top:5px}
.errtxt{font-size:12.5px;color:#F0B8B2}
.invcomp{display:flex;gap:14px;align-items:flex-start;margin:0 0 12px}
.invcomp .fld{flex:1;min-width:0}
.invcomp textarea{font:inherit;resize:vertical;line-height:1.45}
.invcard{width:84px;flex:0 0 auto;border-radius:8px;border:1px solid var(--line);display:block}
@media(max-width:520px){.invcomp{flex-direction:column}.invcard{width:110px}}
.add .go{padding-top:24px}
@media(max-width:640px){.add .go{padding-top:0}}
input[type=tel],.ph{direction:ltr;unicode-bidi:isolate}
body[dir=rtl] input[type=tel]{text-align:right}

.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.filters{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.f{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--dim)}
.f b{font-weight:700;color:var(--text);margin-inline-start:4px}
.f[aria-pressed=true]{border-color:var(--gold);background:var(--gold-soft);color:var(--text)}
.search{min-width:200px;flex:0 1 260px}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:8px 14px;min-height:38px}
.search input:focus{outline:none;border-color:var(--gold)}

.bulk{background:var(--panel-2);border:1px solid rgba(189,155,104,.35);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.bulk .line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bulk .count{font-weight:700;margin-inline-end:auto}
.confirm{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.confirm p{margin:0 0 10px;color:var(--dim);font-size:13.5px}
.confirm p b{color:var(--text)}
.kinds{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.progress{height:8px;border-radius:99px;background:var(--ink);overflow:hidden;margin:12px 0 6px}
.progress i{display:block;height:100%;width:0;background:var(--wa);transition:width .25s}
.result{font-size:13px;color:var(--dim);margin:8px 0 0}

.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.head,.g{display:grid;grid-template-columns:36px minmax(0,1.6fr) minmax(0,1fr) minmax(0,1.1fr) auto;gap:12px;align-items:center;padding:11px 14px}
.head{font-size:12px;color:var(--dimmer);font-weight:600;border-bottom:1px solid var(--line);background:var(--ink)}
.g{border-top:1px solid var(--line-soft)}
.g:first-of-type{border-top:none}
.g.temp{opacity:.6}
.g .nm b{display:block;font-weight:600;overflow-wrap:anywhere}
.g .nm .ph{display:block;color:var(--dim);font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.g .acts{display:flex;gap:6px;justify-content:flex-end}
@media(max-width:760px){
  .head{display:none}
  .g{grid-template-columns:36px 1fr auto;grid-template-areas:"ck nm acts" ". rs rs" ". wa wa";row-gap:6px}
  .g .ck{grid-area:ck}.g .nm{grid-area:nm}.g .rs{grid-area:rs}.g .wa{grid-area:wa}.g .acts{grid-area:acts}
}
.cb{width:18px;height:18px;accent-color:var(--gold);cursor:pointer}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:#BFE0CC}.tag.no{background:var(--no-soft);color:#F0B8B2}
.tag.wait{background:var(--gold-soft);color:#E9D6B6}
.src{font-size:11.5px;color:var(--dimmer);margin-inline-start:6px}
.wast{font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:6px}
.wast i{width:8px;height:8px;border-radius:50%;background:var(--dimmer);flex:none}
.wast.sent i{background:#8FA3C4}.wast.delivered i{background:var(--wa)}.wast.read i{background:#3E9E65;box-shadow:0 0 0 2px rgba(62,158,101,.3)}
.wast.failed{color:#F0B8B2}.wast.failed i{background:var(--no)}
.inb{display:block;font-size:12px;color:var(--dim);margin-top:3px;overflow-wrap:anywhere}
.edit{grid-column:1/-1;display:grid;grid-template-columns:1.2fr 1fr 1fr .6fr;gap:10px;padding:4px 0 6px}
@media(max-width:760px){.edit{grid-template-columns:1fr 1fr}}
.edit .btns{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.edit .btns .sp{flex:1}
.others{margin:0 0 18px}
.others h2{font:600 22px/1.2 var(--disp);margin:0 0 4px}
body[dir=rtl] .others h2{font-family:var(--disp-ar);font-weight:700}
.others .sub{color:var(--dim);font-size:13px;margin:0 0 12px}
.others .list{border-color:rgba(189,155,104,.35)}
.o{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.6fr);gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line-soft)}
.o:first-child{border-top:none}
.o .nm b{display:block;font-weight:600;overflow-wrap:anywhere}
.o .nm .ph{display:block;color:var(--dim);font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.o .nm .nophone{display:block;color:var(--dimmer);font-size:12.5px}
.o .when{display:block;color:var(--dimmer);font-size:11.5px;margin-top:4px}
.o .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.o .acts select{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-height:34px;max-width:200px;font-size:16px}
.o .acts select:focus{outline:none;border-color:var(--gold)}
.o .errtxt{grid-column:1/-1;font-size:12.5px;color:#F0B8B2;margin:0}
@media(max-width:760px){.o{grid-template-columns:1fr auto}.o .acts{grid-column:1/-1;justify-content:flex-start}}
.newbadge{font-size:11px;font-weight:700;color:#17130A;background:var(--gold);border-radius:99px;padding:1px 8px;margin-inline-start:6px;vertical-align:middle}
.empty{padding:34px 16px;text-align:center;color:var(--dim)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.skel{height:300px;border-radius:var(--r);background:linear-gradient(90deg,var(--panel) 0%,var(--panel-2) 50%,var(--panel) 100%);background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
</style>
<style id="pp-layout">
/* ── Pixel Pals layout safeguards ─────────────────────────────────────
   Transparent page so the Wix section shows through seamlessly, sturdy form
   controls on phones, long words wrap instead of widening the page, and a
   safety space at the end so nothing is ever cut off. */
html,body{background:transparent!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-wrap:break-word}
input,select,textarea,button{max-width:100%}
table{max-width:100%}
/* iOS draws date fields wider and taller than other inputs; make them behave. */
input[type=date],input[type=time],input[type=datetime-local]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;display:block}
input[type=date]::-webkit-date-and-time-value{text-align:start;min-height:1.4em}
/* Save bars sit in the flow: a sticky bar needs a solid background, and the page has none. */
.savebar{position:static!important;background:transparent!important}
/* Width: 80% of the frame on wide screens, never narrower than before (1120px). */
.wrap{width:max(80%, min(100%, 1120px))!important;max-width:none!important;margin-left:auto!important;margin-right:auto!important}
@media (max-width:1100px){.wrap{padding-left:20px!important;padding-right:20px!important}}
@media (max-width:600px){.wrap{padding-left:14px!important;padding-right:14px!important}}
/* Safety space under the content (counted by the height reporter). */
.pp-safe-space{display:block;height:140px}
@media (max-width:760px){.pp-safe-space{height:calc(180px + env(safe-area-inset-bottom, 0px))}}
</style>

/* Same rules as the backend, so a bad number is caught before it's sent. */
function normalisePhone(raw, cc="962"){
  let s=String(raw||"").trim().replace(/[٠-٩]/g,d=>String("٠١٢٣٤٥٦٧٨٩".indexOf(d))).replace(/[۰-۹]/g,d=>String("۰۱۲۳۴۵۶۷۸۹".indexOf(d)))
    .replace(/[\s\-().\u200e\u200f]/g,"");
  if (s.startsWith("00")) s="+"+s.slice(2);
  if (!s.startsWith("+")) s = s.startsWith("0") ? `+${cc}${s.slice(1)}` : (s.startsWith(cc) && s.length>cc.length+7 ? "+"+s : `+${cc}${s}`);
  return /^\+\d{8,15}$/.test(s) ? s : null;
}
/* +962 79 123 4567 — Jordanian numbers grouped the way people read them. */
const pretty = p => { const m=/^\+(962)(\d{2})(\d{3})(\d{4})$/.exec(p||""); return m ? `+${m[1]} ${m[2]} ${m[3]} ${m[4]}` : (p||""); };

}

    <span class="acts">${temp ? "" : `<button class="btn wa icon" type="button" data-one="${g.id}" title="${esc(L.sendOne)}" aria-label="${esc(L.sendOne)}" ${canSend()?"":"disabled"}>${ICON.wa}</button>

function wire(){

    if (!phone){ addErr=L.err.badPhone; addErrField="phone"; render(); $("#a-phone").focus(); return; }
    const dup=S.items.find(g=>g.phone===phone);
    if (dup){ addErr=L.err.duplicate(dup.name); addErrField="phone"; render(); $("#a-phone").focus(); return; }
    const tempId="tmp"+(++tempSeq);
    S.items.push({id:tempId,name,phone,rsvpStatus:"pending",waStatus:""});
    S.items.sort((a,b)=>a.name.localeCompare(b.name));
    post({type:"3orsna:saveGuest",guest:{name,phone},tempId});

  const q=$("#q"); if (q) q.oninput=()=>{ query=q.value; render(); };
  $$("[data-sel]").forEach(cb=> cb.onchange=()=>{ cb.checked?sel.add(cb.dataset.sel):sel.delete(cb.dataset.sel); bulk.result=""; if(!sel.size) bulk.open=false; render(); });
  const sa=$("#selAll"); if (sa) sa.onchange=()=>{ const l=shown().filter(g=>!String(g.id).startsWith("tmp")); if (sa.checked) l.forEach(g=>sel.add(g.id)); else l.forEach(g=>sel.delete(g.id)); bulk.result=""; render(); };
  const cs=$("#clearSel"); if (cs) cs.onclick=()=>{ sel.clear(); bulk.open=false; bulk.result=""; render(); };
  $$("[data-kind]").forEach(b=> b.onclick=()=>{ bulk.kind=b.dataset.kind; bulk.open=true; bulk.result=""; render(); const n=$("#b-note"); if(n) n.focus(); });

  const ds=$("#doSend");

               : bulk.kind==="invite" ? (($("#b-msg")||{}).value||"").trim() : "";

  $$("[data-cancel]").forEach(b=> b.onclick=()=>{ editing=null; confirmRemove=null; flash=""; render(); });
  $$("[data-save]").forEach(b=> b.onclick=()=>{

    if (!phone){ flash={id,text:L.err.badPhone}; return render(); }
    b.disabled=true;
    post({type:"3orsna:saveGuest", guest:{id,name,phone,rsvpStatus:$("#e-status").value,partySize:+$("#e-party").value||1}});
  });
  $$("[data-remove]").forEach(b=> b.onclick=()=>{ confirmRemove=b.dataset.remove; render(); });
  $$("[data-remove-no]").forEach(b=> b.onclick=()=>{ confirmRemove=null; render(); });
  $$("[data-remove-yes]").forEach(b=> b.onclick=()=>{ b.disabled=true; post({type:"3orsna:removeGuest",id:b.dataset.removeYes}); });
  $$("[data-oadd]").forEach(b=> b.onclick=()=>{ const id=b.dataset.oadd; linking.add(id); delete linkErr[id]; render(); post({type:"3orsna:linkReply",rsvpId:id}); });
  $$("[data-omatch]").forEach(b=> b.onclick=()=>{
    const id=b.dataset.omatch, s=document.getElementById("om-"+id), gid=s && s.value;
    if (!gid){ linkErr[id]=L.others.pick; render(); const x=document.getElementById("om-"+id); if (x) x.focus(); return; }
    linking.add(id); delete linkErr[id]; render(); post({type:"3orsna:linkReply",rsvpId:id,guestId:gid}); });

window.addEventListener("message", e=>{
  const d=e.data; if (!d || typeof d!=="object") return; const L=t();
  if (d.type==="3orsna:guests"){
    const x=d.data||{};
    S = { loaded:true, ok:!!x.ok, reason:x.reason||"", items:(x.items||[]).slice(), others:(x.others||[]).slice(), waReady:!!x.waReady, wedding:x.wedding||{} };
    const oids=new Set(S.others.map(o=>o.id)); linking=new Set([...linking].filter(i=>oids.has(i)));
    const ids=new Set(S.items.map(g=>g.id)); sel=new Set([...sel].filter(i=>ids.has(i)));
    render();
  }
  if (d.type==="3orsna:guestSaved" && d.item){
    const i=S.items.findIndex(g=>g.id===(d.tempId||d.item.id));
    if (i>-1) S.items[i]=d.item; else S.items.push(d.item);
    S.items.sort((a,b)=>a.name.localeCompare(b.name));
    if (!d.tempId){ editing=null; flash=""; }
    render();
  }
  if (d.type==="3orsna:guestError"){
    const msg = d.reason==="duplicate" ? L.err.duplicate(d.name||"") : (L.err[d.reason] || L.err.generic);
    if (d.tempId){ S.items=S.items.filter(g=>g.id!==d.tempId); addErr=msg; addErrField=d.reason==="noName"?"name":"phone"; }
    else if (d.id){ flash={id:d.id,text:msg}; confirmRemove=null; }
    render();
  }
  if (d.type==="3orsna:linkError"){ linking.delete(d.rsvpId); linkErr[d.rsvpId]=L.others.err[d.reason]||L.others.err.generic; render(); }
  if (d.type==="3orsna:guestRemoved"){ S.items=S.items.filter(g=>g.id!==d.id); sel.delete(d.id); editing=null; confirmRemove=null; render(); }
  if (d.type==="3orsna:sendProgress"){
    Object.assign(bulk,{done:d.done,total:d.total,sent:d.sent,failed:d.failed});

    bulk.result = d.stopped ? (L.stopped[d.stopped] || L.stopped.network) + (d.sent?" "+L.sentN(num(d.sent),num(d.failed)):"")
                            : L.sentN(num(d.sent), num(d.failed));

/* Say "ready" every second until the page answers — the page's listener may

window.addEventListener("message", e => { if (e.data && e.data.type === "3orsna:guests") __answered = true; });
(function ping(n){
  if (__answered) return;
  try{ window.parent.postMessage({type:"3orsna:guestsReady"}, "*"); }catch(e){}
  if (n < 30) setTimeout(() => ping(n + 1), 1000);
})(0);
