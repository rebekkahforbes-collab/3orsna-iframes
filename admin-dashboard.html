<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<style>
/* ── Pixel Pals build standards ─────────────────────────────────────
   No visible scrollbars anywhere (everything still scrolls), media never
   wider than its box, 16px form text on phones so iOS doesn't zoom.
   Height: the reporter at the end of this file (setHeight → site-wide listener). */
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0;height:0;display:none}
img,video,canvas{max-width:100%}
@media (max-width:760px){input,select,textarea{font-size:16px!important}}

:root{
  --ink:#14161A; --panel:#1C1F25; --panel-2:#232730; --line:#2A2E36; --line-soft:#22252C;
  --text:#E8E6E1; --dim:#9298A3; --dimmer:#6B7280;
  --gold:#BD9B68; --gold-hi:#CDB184; --gold-soft:rgba(189,155,104,.15);
  --ok:#7FB496; --ok-soft:rgba(127,180,150,.14); --no:#D9736B; --no-soft:rgba(217,115,107,.13);
  --hid:#8FA3C4; --hid-soft:rgba(143,163,196,.14);
  --r:12px; --ui:'Manrope',system-ui,-apple-system,sans-serif; --disp:'Cormorant Garamond',Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--text);font:14px/1.5 var(--ui);overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
a{color:inherit}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 40px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.top h1{font:600 clamp(28px,4vw,38px)/1.1 var(--disp);margin:0}
.top .who{color:var(--dim);font-size:13px;margin-top:4px}
.top .sp{flex:1}
.flash{font-size:13px;color:var(--ok);min-height:20px}
.flash.bad{color:#F0B8B2}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--panel);
  padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13px;min-height:40px;transition:background .15s,border-color .15s;white-space:nowrap;text-decoration:none}
.btn:hover:not([disabled]){background:var(--panel-2);border-color:#353A44}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#17130A}
.btn.primary:hover:not([disabled]){background:var(--gold-hi);border-color:var(--gold-hi)}
.btn.ghost{background:transparent}
.btn.danger{border-color:rgba(217,115,107,.45);color:#F0B8B2;background:var(--no-soft)}
.btn.good{border-color:rgba(127,180,150,.5);color:#BFE0CC;background:var(--ok-soft)}
.btn.sm{padding:6px 11px;min-height:34px;font-size:12.5px}

/* layout: side menu on wide screens, a row of tabs on narrow ones */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:26px;align-items:start}
@media(max-width:960px){.shell{grid-template-columns:minmax(0,1fr);gap:16px}}
.nav{display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.nav .grp{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dimmer);padding:12px 10px 4px}
.nav .grp:first-child{padding-top:4px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:start;border:none;background:transparent;
  padding:9px 10px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--dim)}
.nav button:hover{background:var(--panel-2);color:var(--text)}
.nav button[aria-current=page]{background:var(--gold-soft);color:var(--text)}
.nav button b{font-size:11.5px;font-weight:700;color:#17130A;background:var(--gold);border-radius:99px;padding:1px 7px}
@media(max-width:960px){
  .nav{flex-direction:row;overflow-x:auto;padding:6px;gap:4px}
  .nav .grp{display:none}
  .nav button{white-space:nowrap;flex:none}
}

.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h2{font:600 26px/1.15 var(--disp);margin:0;flex:1;min-width:200px}
.head p{margin:4px 0 0;color:var(--dim);font-size:13px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:transparent;padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--dim)}
.seg button[aria-pressed=true]{background:var(--gold-soft);color:var(--text)}

.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.filters{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.f{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--dim)}
.f b{font-weight:700;color:var(--text);margin-inline-start:4px}
.f[aria-pressed=true]{border-color:var(--gold);background:var(--gold-soft);color:var(--text)}
.search{flex:0 1 260px;min-width:180px}
@media(max-width:720px){.search{flex:1 1 100%}}
.search input,.tools select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:8px 14px;min-height:38px}
.tools select{width:auto;border-radius:10px}
.search input:focus,.tools select:focus{outline:none;border-color:var(--gold)}

.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;border-top:1px solid var(--line-soft)}
.row.noimg{grid-template-columns:minmax(0,1fr) auto}
.row:first-child{border-top:none}
.row.busy{opacity:.55;pointer-events:none}
.th{width:56px;height:56px;border-radius:9px;background:var(--panel-2) center/cover no-repeat}
.ti b{display:block;font-weight:700;font-size:14.5px;overflow-wrap:anywhere}
.ti .meta{color:var(--dim);font-size:12.5px;overflow-wrap:anywhere}
.ti .meta span+span::before{content:" · ";color:var(--dimmer)}
.ti .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ti .why{display:block;color:#F0B8B2;font-size:12.5px;margin-top:5px}
.ti .msg{display:block;color:var(--dim);font-size:12.5px;margin-top:5px;font-style:italic;overflow-wrap:anywhere}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.acts select{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-height:34px;font-size:12.5px}
@media(max-width:720px){
  .row{grid-template-columns:48px minmax(0,1fr)}.row.noimg{grid-template-columns:minmax(0,1fr)}
  .th{width:48px;height:48px}
  .acts{grid-column:1/-1;justify-content:flex-start}
}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.live{background:var(--ok-soft);color:#BFE0CC}
.tag.hidden{background:var(--hid-soft);color:#C7D3E6}
.tag.takenDown,.tag.bad{background:var(--no-soft);color:#F0B8B2}
.tag.gold{background:var(--gold-soft);color:#E9D6B6}
.tag.plain{background:rgba(255,255,255,.06);color:var(--dim)}
.tag.plain::before,.tag.gold.noDot::before{display:none}

.confirm{grid-column:1/-1;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}
.confirm p{margin:0;color:var(--dim);font-size:13px}
.confirm p b{color:var(--text)}
.confirm textarea,.confirm input[type=email]{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:40px;resize:vertical}
.confirm textarea:focus,.confirm input:focus{outline:none;border-color:var(--gold)}
.confirm .line{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.confirm .err{color:#F0B8B2;font-size:12.5px;margin:0}
.chk{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--dim);cursor:pointer}
.chk input{width:17px;height:17px;margin:0;accent-color:var(--gold);flex:none}
.fld label.chk{display:inline-flex;margin:0;font-size:13px}

.empty{padding:34px 16px;text-align:center;color:var(--dim)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.note{color:var(--dimmer);font-size:12.5px;margin:10px 2px 0}
.skel{height:280px;border-radius:var(--r);background:linear-gradient(90deg,var(--panel) 0%,var(--panel-2) 50%,var(--panel) 100%);background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
.errbox{background:var(--no-soft);border:1px solid rgba(217,115,107,.35);color:#F0B8B2;border-radius:10px;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.errbox span{flex:1;min-width:200px}

/* overview */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.kpis{grid-template-columns:minmax(0,1fr)}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.kpi h3{margin:0 0 2px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dimmer);font-weight:700}
.kpi .big{font:600 34px/1.1 var(--disp);margin:2px 0 10px}
.kpi .big small{font:500 13px var(--ui);color:var(--dim);margin-inline-start:6px}
.kpi .links{display:flex;flex-wrap:wrap;gap:6px}
.kpi .links button{border:1px solid var(--line);background:var(--ink);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--dim);cursor:pointer}
.kpi .links button:hover{border-color:var(--gold);color:var(--text)}
.kpi .links button b{color:var(--text);margin-inline-start:3px}
.kpi .links button.warn b{color:#F0B8B2}
.sub{font:600 20px/1.2 var(--disp);margin:22px 0 10px}

/* categories */
.cats{margin-top:22px}
.cats .row{grid-template-columns:minmax(0,1fr) auto}
.addcat{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line-soft);flex-wrap:wrap}
.addcat input{flex:1;min-width:180px;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:38px}
.addcat input:focus{outline:none;border-color:var(--gold)}

/* add venue form */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card h3{margin:0 0 4px;font-size:15px;font-weight:700}
.card .lede{margin:0 0 14px;color:var(--dim);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
@media(max-width:720px){.grid{grid-template-columns:minmax(0,1fr)}}
.fld.full{grid-column:1/-1}
.fld label{display:block;font-size:12.5px;color:var(--dim);font-weight:500;margin-bottom:6px}
.fld label i{color:var(--gold);font-style:normal}
.fld input:not([type=checkbox]),.fld select,.fld textarea{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:40px}
.fld textarea{min-height:96px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--gold)}
.fld .hint{font-size:12px;color:var(--dimmer);margin-top:5px}
.fld.bad input,.fld.bad .drop{border-color:var(--no)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--ink);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--dim)}
.chip[aria-pressed=true]{border-color:var(--gold);background:var(--gold-soft);color:var(--text)}
.toggles{display:flex;flex-wrap:wrap;gap:10px 22px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--ink)}
.drop p{margin:0;color:var(--dim);font-size:13px;flex:1;min-width:180px}
.pics{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pic{position:relative;width:84px;height:64px;border-radius:8px;background:var(--panel-2) center/cover no-repeat;border:1px solid var(--line)}
.pic.big{width:160px;height:110px}
.pic.up::after{content:"Uploading…";position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);font-size:11px;font-weight:600;border-radius:8px}
.pic.fail{border-color:var(--no)}
.pic button{position:absolute;top:-7px;inset-inline-end:-7px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;font-size:13px;line-height:1;padding:0}
details.more{margin-top:4px}
details.more summary{cursor:pointer;color:var(--gold);font-weight:600;font-size:13px;padding:6px 0}
.formerr{background:var(--no-soft);border:1px solid rgba(217,115,107,.35);color:#F0B8B2;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.submit{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.submit .sp{flex:1}
</style>
<style id="pp-layout">
/* ── Pixel Pals layout safeguards ─────────────────────────────────────
   Transparent page so the Wix section shows through seamlessly, sturdy form
   controls on phones, long words wrap instead of widening the page, and a
   safety space at the end so nothing is ever cut off. */
html,body{background:transparent!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-wrap:break-word}
input,select,textarea,button{max-width:100%}
table{max-width:100%}
/* iOS draws date fields wider and taller than other inputs; make them behave. */
input[type=date],input[type=time],input[type=datetime-local]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;display:block}
input[type=date]::-webkit-date-and-time-value{text-align:start;min-height:1.4em}
/* Save bars sit in the flow: a sticky bar needs a solid background, and the page has none. */
.savebar{position:static!important;background:transparent!important}
/* Width: 80% of the frame on wide screens, never narrower than before (1240px). */
.wrap{width:max(80%, min(100%, 1240px))!important;max-width:none!important;margin-left:auto!important;margin-right:auto!important}
@media (max-width:1100px){.wrap{padding-left:20px!important;padding-right:20px!important}}
@media (max-width:600px){.wrap{padding-left:14px!important;padding-right:14px!important}}
/* Safety space under the content (counted by the height reporter). */
.pp-safe-space{display:block;height:140px}
@media (max-width:760px){.pp-safe-space{height:calc(180px + env(safe-area-inset-bottom, 0px))}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>Admin dashboard</h1><div class="who" id="who">Checking your access…</div></div>
    <span class="sp"></span>
    <span class="flash" id="flash" role="status" aria-live="polite"></span>
    <button class="btn sm" type="button" id="refresh">Refresh</button>
  </div>
  <div class="shell">
    <nav class="nav" id="nav" aria-label="Admin sections"></nav>
    <main id="main"><div class="skel"></div></main>
  </div>
</div>
<input type="file" id="filePick" accept="image/*" hidden>

<script>
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const post = m => { try{ window.parent.postMessage(m,"*"); }catch(e){} };
const fmtDate = d => d ? new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}) : "";
const n = v => Number(v||0).toLocaleString("en-GB");

/* ═══ talking to the page: one request → one result ═══ */
let BASE = "", seqReq = 0;
const waiting = {};
function call(fn, ...args){
  return new Promise(res=>{
    const reqId = "r"+(++seqReq);
    waiting[reqId] = res;
    post({type:"ad:call", reqId, fn, args});
    setTimeout(()=>{ if (waiting[reqId]){ delete waiting[reqId]; res({ok:false,error:"No answer from the page. Check your connection and try again."}); } }, 60000);
  });
}
const pageUrl = path => !path ? "" : /^https?:\/\//.test(path) ? path : BASE + path;
const inviteUrl = it => it.slug ? `${BASE}/invite/${encodeURIComponent(it.slug)}` : (it.link||"");

/* ═══ state ═══ */
const TABS = [
  { id:"overview",  label:"Overview",            grp:"" },
  { id:"venues",    label:"Venues",              grp:"Listings" },
  { id:"talent",    label:"Talent",              grp:"Listings" },
  { id:"offers",    label:"Catering & offers",   grp:"Listings" },
  { id:"add",       label:"Add venue to claim",  grp:"Listings" },
  { id:"couples",   label:"Couples",             grp:"People" },
  { id:"accounts",  label:"Accounts",            grp:"People" },
  { id:"enquiries", label:"Enquiries",           grp:"Activity" }
];
const DATA = {};                                   // kind → { items, loading, error, more }
let OVERVIEW = null, overviewErr = "";
const V = {
  tab:"overview",
  sub:{ offers:"catering", enquiries:"venueEnquiries", accounts:"vendors" },
  filter:{}, query:{}, sort:{},
  open:null,                                     // { kind, id, action } — the inline confirm panel
  openErr:""
};
const BUSY = new Set();
let flashTimer = 0;
function flash(text, bad){
  const f=$("#flash"); f.textContent=text||""; f.className="flash"+(bad?" bad":"");
  clearTimeout(flashTimer); if (text) flashTimer=setTimeout(()=>{ f.textContent=""; }, 5000);
}

/* What each list can be filtered by. */
const STATE_LABEL = { live:"Live", hidden:"Hidden", takenDown:"Taken down" };
const FILTERS = {
  venues:  [["all","All"],["live","Live"],["hidden","Hidden"],["takenDown","Taken down"],["unclaimed","Waiting to be claimed"]],
  talent:  [["all","All"],["live","Live"],["hidden","Hidden"],["takenDown","Taken down"],["featured","Featured"]],
  catering:[["all","All"],["live","Live"],["hidden","Hidden"]],
  packages:[["all","All"],["live","Live"],["hidden","Hidden"],["expired","Expired"]],
  promotions:[["all","All"],["live","Live"],["hidden","Hidden"],["expired","Expired"]],
  weddings:[["all","All"],["published","Published"],["draft","Draft"],["noGuests","Guest list off"]],
  venueEnquiries:[["all","All"],["new","New"],["contacted","Contacted"],["booked","Booked"],["declined","Declined"]],
  talentEnquiries:[["all","All"],["new","New"],["contacted","Contacted"],["booked","Booked"],["declined","Declined"]],
  vendors:[["all","All"]],
  talentProfiles:[["all","All"],["suspended","Suspended"]]
};
function matches(kind, it, f){
  if (f==="all") return true;
  if (["live","hidden","takenDown"].includes(f)) return it.state===f;
  if (f==="unclaimed") return it.unclaimed;
  if (f==="featured") return it.featured;
  if (f==="expired") return it.expired;
  if (f==="published") return it.published;
  if (f==="draft") return !it.published;
  if (f==="noGuests") return !it.guestList;
  if (f==="suspended") return it.suspended;
  if (["new","contacted","booked","declined"].includes(f)) return it.status===f;
  return true;
}
function haystack(it){
  return [it.title,it.name,it.email,it.city,it.category,it.listing,it.claimEmail,it.slug,it.phone,it.venue,
    it.owner && (typeof it.owner==="string" ? it.owner : it.owner.name+" "+it.owner.email)].filter(Boolean).join(" ").toLowerCase();
}
function shown(kind){
  const D = DATA[kind]; if (!D || !D.items) return [];
  const f = V.filter[kind]||"all", q = (V.query[kind]||"").trim().toLowerCase(), s = V.sort[kind]||"new";
  const out = D.items.filter(it => matches(kind,it,f) && (!q || haystack(it).includes(q)));
  out.sort((a,b)=> s==="az" ? String(a.title||a.name).localeCompare(String(b.title||b.name))
                 : s==="old" ? new Date(a.created||0)-new Date(b.created||0)
                 : new Date(b.created||0)-new Date(a.created||0));
  return out;
}

/* ═══ loading ═══ */
async function load(kind, force){
  if (kind==="overview"){
    if (OVERVIEW && !force) return;
    const r = await call("overview");
    if (r.ok){ OVERVIEW=r; overviewErr=""; } else overviewErr=r.error||"Couldn't load.";
    return render();
  }
  const D = DATA[kind] = DATA[kind] || {};
  if (D.items && !force) return;
  D.loading = true; D.error = ""; render();
  const r = await call("list", kind);
  D.loading = false;
  if (r.ok){ D.items = r.items||[]; D.more = !!r.more; } else D.error = r.error||"Couldn't load.";
  render();
}
function kindsFor(tab){
  if (tab==="offers") return [V.sub.offers];
  if (tab==="enquiries") return [V.sub.enquiries];
  if (tab==="accounts") return [V.sub.accounts];
  if (tab==="couples") return ["weddings"];
  if (tab==="talent") return ["talent","categories"];
  if (tab==="add") return ["venues"];
  return [tab];
}
function openTab(tab, filterKind, filter){
  V.tab = tab; V.open = null;
  if (filterKind){ V.filter[filterKind] = filter || "all"; }
  render(); toTop();
  if (tab==="add") loadChoices();
  kindsFor(tab).forEach(k=>load(k));
}
function toTop(){ try{ document.body.scrollTop=0; }catch(e){} post({type:"ad:scrollTop"}); }

/* ═══ actions ═══ */
async function act(kind, id, action, extra){
  BUSY.add(id); render();
  const r = await call("act", kind, id, action, extra||{});
  BUSY.delete(id);
  if (!r.ok){ if (V.open && V.open.id===id){ V.openErr = r.error; } else flash(r.error,true); render(); return false; }
  const D = DATA[kind];
  if (D && D.items){
    if (r.removed) D.items = D.items.filter(x=>x.id!==id);
    else if (r.item){ const i=D.items.findIndex(x=>x.id===id); if (i>-1) D.items[i]=Object.assign({}, D.items[i], r.item); else D.items.unshift(r.item); }
  }
  if (kind==="categories" && (action==="up"||action==="down")) { await load("categories", true); }
  V.open=null; V.openErr="";
  OVERVIEW = null;                                  // counts changed — reload when next opened
  const done = { hide:"Hidden.", show:"Visible again.", takeDown:"Taken down.", restore:"Restored — it's live again.", feature:"Featured.",
    unfeature:"No longer featured.", publish:"Published.", unpublish:"Unpublished.", guestListOn:"Guest list switched on.", guestListOff:"Guest list switched off.",
    status:"Status saved.", suspend:"Account suspended.", unsuspend:"Suspension lifted.", setClaim:"Owner's email saved.", invite:"Invitation sent.",
    delete:"Deleted.", add:"Category added." }[action] || "Saved.";
  flash(done + (r.emailed===true ? " The owner was emailed." : r.emailed===false ? " (The email couldn't be sent — check the triggered email.)" : ""));
  render();
  return true;
}

/* ═══ rendering ═══ */
function render(){
  renderNav();
  const m = $("#main");
  const keep = {}; $$("#main input[data-keep], #main textarea[data-keep]").forEach(el=>{ keep[el.dataset.keep]=el.value; });
  const fid = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.keep;
  if (V.tab==="add"){ renderAdd(); return; }
  m.innerHTML = ({ overview:viewOverview, venues:()=>viewList("venues"), talent:viewTalent, offers:viewOffers,
                   couples:()=>viewList("weddings"), accounts:viewAccounts, enquiries:viewEnquiries })[V.tab]();
  $$("#main [data-keep]").forEach(el=>{ if (keep[el.dataset.keep]!=null) el.value=keep[el.dataset.keep]; });
  if (fid){ const el=document.querySelector(`#main [data-keep="${fid}"]`); if (el){ el.focus(); try{ el.setSelectionRange(el.value.length,el.value.length); }catch(e){} } }
  wire();
}
function renderNav(){
  const ov = OVERVIEW, badge = { venues: ov && ov.venues.unclaimed, enquiries: ov && (ov.enquiries.venueNew + ov.enquiries.talentNew) };
  let html = "", grp = null;
  TABS.forEach(t=>{
    if (t.grp !== grp){ grp = t.grp; if (grp) html += `<div class="grp">${grp}</div>`; }
    const b = t.id==="enquiries" && badge.enquiries ? `<b title="New enquiries">${n(badge.enquiries)}</b>` : "";
    html += `<button type="button" data-tab="${t.id}" ${V.tab===t.id?'aria-current="page"':""}><span>${t.label}</span>${b}</button>`;
  });
  $("#nav").innerHTML = html;
  $$("#nav [data-tab]").forEach(b=> b.onclick=()=>openTab(b.dataset.tab));
}
const loadingOr = (kind, fn) => {
  const D = DATA[kind];
  if (!D || (D.loading && !D.items)) return `<div class="skel"></div>`;
  if (D.error && !D.items) return `<div class="errbox"><span>${esc(D.error)}</span><button class="btn sm" type="button" data-reload="${kind}">Try again</button></div>`;
  return fn();
};
function head(title, lede, right){
  return `<div class="head"><div style="flex:1;min-width:220px"><h2>${title}</h2>${lede?`<p>${lede}</p>`:""}</div>${right||""}</div>`;
}
function tools(kind){
  const D = DATA[kind] || {}, f = V.filter[kind]||"all", items = D.items||[];
  const chips = (FILTERS[kind]||[]).map(([k,l])=>`<button class="f" type="button" data-f="${kind}|${k}" aria-pressed="${f===k}">${l}<b>${n(items.filter(it=>matches(kind,it,k)).length)}</b></button>`).join("");
  return `<div class="tools"><div class="filters">${chips}</div>
    <div class="search"><input type="search" data-keep="q-${kind}" data-q="${kind}" placeholder="Search" aria-label="Search"></div>
    <select data-sort="${kind}" aria-label="Sort">${[["new","Newest first"],["old","Oldest first"],["az","A–Z"]].map(([k,l])=>`<option value="${k}"${(V.sort[kind]||"new")===k?" selected":""}>${l}</option>`).join("")}</select></div>`;
}
function listHtml(kind, rowFn, emptyText){
  const items = shown(kind), D = DATA[kind]||{};
  const rows = items.map(it => rowFn(it) + "").join("");
  return `<div class="list">${rows || `<div class="empty"><b>${(D.items||[]).length ? "Nothing matches" : emptyText||"Nothing here yet"}</b>${(D.items||[]).length ? "Try another filter or search." : ""}</div>`}</div>
    ${D.more ? `<p class="note">Showing the newest 1,000. Use search to narrow it down.</p>` : ""}`;
}

/* — overview — */
function viewOverview(){
  if (!OVERVIEW) return overviewErr ? `<div class="errbox"><span>${esc(overviewErr)}</span><button class="btn sm" type="button" data-reload="overview">Try again</button></div>` : `<div class="skel"></div>`;
  const o = OVERVIEW;
  const link = (tab, kind, f, label, count, warn) => `<button type="button" class="${warn&&count?"warn":""}" data-go="${tab}|${kind||""}|${f||""}">${label}<b>${n(count)}</b></button>`;
  const kpi = (h, big, small, links) => `<div class="kpi"><h3>${h}</h3><div class="big">${n(big)}${small?`<small>${small}</small>`:""}</div><div class="links">${links}</div></div>`;
  const recent = (o.recent||[]).map(e=>`<div class="row noimg"><div class="ti"><b>${esc(e.name)} → ${esc(e.listing||"")}</b>
      <div class="meta"><span>${e.kind==="venue"?"Venue":"Talent"}</span><span>${esc(fmtDate(e.created))}</span>${e.email?`<span>${esc(e.email)}</span>`:""}</div></div>
      <div class="acts"><span class="tag ${e.status==="new"?"gold":"plain"}">${esc(cap(e.status))}</span></div></div>`).join("");
  return head("Overview", "Everything on the platform at a glance. Click any number to open that list.") +
  `<div class="kpis">
    ${kpi("Venues", o.venues.live, "live", link("venues","venues","all","All",o.venues.total)+link("venues","venues","hidden","Hidden",o.venues.hidden)+link("venues","venues","takenDown","Taken down",o.venues.takenDown,1)+link("add","","","To be claimed",o.venues.unclaimed))}
    ${kpi("Talent", o.talent.live, "live", link("talent","talent","all","All",o.talent.total)+link("talent","talent","hidden","Hidden",o.talent.hidden)+link("talent","talent","takenDown","Taken down",o.talent.takenDown,1)+link("talent","talent","featured","Featured",o.talent.featured))}
    ${kpi("Enquiries", o.enquiries.venueNew + o.enquiries.talentNew, "new", link("enquiries","venueEnquiries","new","Venue · new",o.enquiries.venueNew)+link("enquiries","talentEnquiries","new","Talent · new",o.enquiries.talentNew)+`<button type="button" disabled>Last 30 days<b>${n(o.enquiries.venue30+o.enquiries.talent30)}</b></button>`)}
    ${kpi("Couples", o.couples.weddings, "wedding pages", link("couples","weddings","published","Published",o.couples.published)+link("couples","weddings","draft","Draft",o.couples.weddings-o.couples.published)+`<button type="button" disabled>Guests<b>${n(o.couples.guests)}</b></button><button type="button" disabled>Replies<b>${n(o.couples.replies)}</b></button>`)}
    ${kpi("Catering & offers", o.offers.catering+o.offers.packages+o.offers.promotions, "listed", link("offers","catering","all","Catering",o.offers.catering)+link("offers","packages","all","Packages",o.offers.packages)+link("offers","promotions","all","Promotions",o.offers.promotions)+link("offers","catering","hidden","Hidden catering",o.offers.cateringHidden))}
    ${kpi("Accounts", o.accounts.vendors+o.accounts.talent, "vendors & talent", link("accounts","vendors","all","Vendors",o.accounts.vendors)+link("accounts","talentProfiles","all","Talent",o.accounts.talent)+link("accounts","talentProfiles","suspended","Suspended",o.accounts.suspended,1))}
  </div>
  <h3 class="sub">Latest enquiries</h3>
  <div class="list">${recent || `<div class="empty"><b>No enquiries yet</b></div>`}</div>`;
}
const cap = s => s ? s.charAt(0).toUpperCase()+s.slice(1) : "";

/* — rows — */
function confirmPanel(it, kind){
  const o = V.open; if (!o || o.id!==it.id || o.kind!==kind) return "";
  const err = V.openErr ? `<p class="err" role="alert">${esc(V.openErr)}</p>` : "";
  const go = (label, cls) => `<div class="line"><button class="btn ${cls||"danger"} sm" type="button" data-confirm="${kind}|${it.id}|${o.action}">${label}</button><button class="btn ghost sm" type="button" data-cancel>Cancel</button></div>`;
  if (o.action==="takeDown") return `<div class="confirm"><p>Take <b>${esc(it.title)}</b> off the site. The owner sees your reason word for word and <b>can't switch it back on</b> — only Restore puts it back.</p>
    <textarea data-keep="reason" id="reason" rows="2" maxlength="500" placeholder="Reason — e.g. Photos don't show the venue. Please upload real photos."></textarea>
    <label class="chk"><input type="checkbox" id="notify" checked> Email the owner</label>${err}${go("Take down")}</div>`;
  if (o.action==="restore") return `<div class="confirm"><p>Put <b>${esc(it.title)}</b> back on the site, live.</p>
    <label class="chk"><input type="checkbox" id="notify" checked> Email the owner</label>${err}${go("Restore","good")}</div>`;
  if (o.action==="delete") return `<div class="confirm"><p>Delete <b>${esc(it.title)}</b> for good? Nobody has claimed it yet. This can't be undone.</p>${err}${go("Delete venue")}</div>`;
  if (o.action==="unpublish") return `<div class="confirm"><p>Unpublish <b>${esc(it.title)}</b>? Guests opening the link will no longer see it. The couple can publish it again from their dashboard.</p>${err}${go("Unpublish")}</div>`;
  if (o.action==="suspend") return `<div class="confirm"><p>Suspend <b>${esc(it.name)}</b>? They can't edit or add listings, and enquiries to them stop, until you lift it.</p>${err}${go("Suspend account")}</div>`;
  if (o.action==="setClaim") return `<div class="confirm"><p>The email the owner will sign up with. When a vendor account with this email opens their dashboard, they can claim <b>${esc(it.title)}</b>.</p>
    <input type="email" data-keep="claimEmail" id="claimEmail" value="${esc(it.claimEmail)}" placeholder="owner@example.com">
    <label class="chk"><input type="checkbox" id="invite"> Email them an invitation to sign up and claim it</label>${err}${go("Save email","primary")}</div>`;
  return "";
}
const rowWrap = (it, kind, img, body, acts) =>
  `<div class="row${img===null?" noimg":""}${BUSY.has(it.id)?" busy":""}">${img===null?"":`<span class="th" style="${img?`background-image:url('${esc(img)}')`:""}"></span>`}
    <div class="ti">${body}</div><div class="acts">${BUSY.has(it.id)?`<span class="tag plain">Saving…</span>`:acts}</div>${confirmPanel(it, kind)}</div>`;
const btn = (kind, id, action, label, cls) => `<button class="btn sm ${cls||""}" type="button" data-act="${kind}|${id}|${action}">${label}</button>`;
const ask = (kind, id, action, label, cls) => `<button class="btn sm ${cls||""}" type="button" data-ask="${kind}|${id}|${action}">${label}</button>`;
const view = (url, label) => url ? `<a class="btn sm ghost" href="${esc(url)}" target="_blank" rel="noopener">${label||"View"} ↗</a>` : "";
const stateTag = s => `<span class="tag ${s}">${STATE_LABEL[s]||s}</span>`;
const meta = parts => `<div class="meta">${parts.filter(Boolean).map(p=>`<span>${p}</span>`).join("")}</div>`;
const ownerLine = o => o ? `${esc(o.name||"")}${o.email?` (${esc(o.email)})`:""}` : "";

const ROW = {
  venues: it => rowWrap(it,"venues",it.image,
    `<b>${esc(it.title)}</b>${meta([esc(it.city), it.maxGuests?`up to ${n(it.maxGuests)} guests`:"", it.pricePerGuest?`JOD ${n(it.pricePerGuest)}/guest`:"", `${n(it.enquiries)} enquiries`])}
     ${meta([it.unclaimed ? (it.claimEmail?`To be claimed by ${esc(it.claimEmail)}`:"No owner yet") : `Owner: ${ownerLine(it.owner)||"unknown"}`])}
     <div class="tags">${stateTag(it.state)}${it.unclaimed?`<span class="tag gold">Waiting to be claimed</span>`:""}</div>
     ${it.state==="takenDown"&&it.reason?`<span class="why">Reason: ${esc(it.reason)}</span>`:""}`,
    view(pageUrl(it.link)) +
    (it.state==="takenDown" ? ask("venues",it.id,"restore","Restore","good")
      : (it.state==="live" ? btn("venues",it.id,"hide","Hide") : btn("venues",it.id,"show","Show")) + ask("venues",it.id,"takeDown","Take down","danger")) +
    (it.unclaimed ? ask("venues",it.id,"setClaim","Owner's email") : "")),
  talent: it => rowWrap(it,"talent",it.image,
    `<b>${esc(it.title)}</b>${meta([esc(it.category), esc(it.city), it.priceFrom?`from JOD ${n(it.priceFrom)}`:"", `${n(it.enquiries)} enquiries`])}
     ${meta([`Owner: ${ownerLine(it.owner)||"unknown"}`])}
     <div class="tags">${stateTag(it.state)}${it.featured?`<span class="tag gold">Featured</span>`:""}${it.owner&&it.owner.suspended?`<span class="tag bad">Account suspended</span>`:""}</div>
     ${it.state==="takenDown"&&it.reason?`<span class="why">Reason: ${esc(it.reason)}</span>`:""}`,
    view(pageUrl(it.link)) +
    (it.state==="live" ? btn("talent",it.id,it.featured?"unfeature":"feature",it.featured?"Unfeature":"Feature") : "") +
    (it.state==="takenDown" ? ask("talent",it.id,"restore","Restore","good")

  offer: kind => it => rowWrap(it,kind,kind==="catering"?it.image:null,
    `<b>${esc(it.title)}</b>${meta([it.price?`JOD ${n(it.price)}${kind==="catering"?" per person":""}`:"", it.discount?esc(it.discount)+" off":"", it.guests?`${esc(it.guests)} guests`:"",
       it.until?`${it.expired?"Ended":"Until"} ${esc(fmtDate(it.until))}`:""])}
     ${meta([`Owner: ${ownerLine(it.owner)||"unknown"}`])}
     <div class="tags">${stateTag(it.state)}${it.expired?`<span class="tag plain">Expired</span>`:""}</div>`,
    it.state==="live" ? btn(kind,it.id,"hide","Hide") : btn(kind,it.id,"show","Show")),
  weddings: it => rowWrap(it,"weddings",null,
    `<b>${esc(it.title)}</b>${meta([it.date?esc(fmtDate(it.date)):"No date yet", esc([it.venue,it.city].filter(Boolean).join(", ")), it.owner?esc(it.owner):""])}
     ${meta([`${n(it.guests)} guests on the list`, `${n(it.replies)} replies`, it.slug?`/invite/${esc(it.slug)}`:""])}
     <div class="tags"><span class="tag ${it.published?"live":"hidden"}">${it.published?"Published":"Draft"}</span>${it.guestList?"":`<span class="tag plain">Guest list off</span>`}</div>`,
    (it.slug ? view(inviteUrl(it), it.published?"View":"Preview") : "") +
    (it.published ? ask("weddings",it.id,"unpublish","Unpublish") : btn("weddings",it.id,"publish","Publish")) +
    btn("weddings",it.id,it.guestList?"guestListOff":"guestListOn",it.guestList?"Guest list off":"Guest list on")),
  enquiry: kind => it => rowWrap(it,kind,null,
    `<b>${esc(it.name)} → ${esc(it.listing)}</b>${meta([esc(fmtDate(it.created)), it.email?`<a href="mailto:${esc(it.email)}">${esc(it.email)}</a>`:"", it.phone?`<a href="tel:${esc(it.phone)}">${esc(it.phone)}</a>`:""])}
     ${meta([it.guests?`${n(it.guests)} guests`:"", it.date?`Event ${esc(fmtDate(it.date))}`:"", (it.dates||[]).length?`Dates: ${esc(it.dates.map(fmtDate).join(", "))}`:"", it.budget?`Budget JOD ${n(it.budget)}`:"",
       kind==="venueEnquiries" ? (it.ownerEmail ? `Sent to ${esc(it.ownerEmail)}` : `<span style="color:#E9D6B6">No owner yet — answer it yourself</span>`) : "", it.emailed?"Emailed":"Not emailed"])}
     ${it.message?`<span class="msg">“${esc(it.message)}”</span>`:""}`,
    `<select data-status="${kind}|${it.id}" aria-label="Status">${["new","contacted","booked","declined"].map(s=>`<option value="${s}"${it.status===s?" selected":""}>${cap(s)}</option>`).join("")}</select>`),
  vendors: it => rowWrap(it,"vendors",null,
    `<b>${esc(it.name||"(no name)")}</b>${meta([it.email?`<a href="mailto:${esc(it.email)}">${esc(it.email)}</a>`:"", it.phone?esc(it.phone):"", esc(it.position)])}
     ${meta([`${n(it.listings)} venues`, `Joined ${esc(fmtDate(it.created))}`])}`,
    `<button class="btn sm ghost" type="button" data-go="venues|venues|all|${esc(it.email)}">Their venues</button>`),
  talentProfiles: it => rowWrap(it,"talentProfiles",null,
    `<b>${esc(it.name||"(no name)")}</b>${meta([it.email?`<a href="mailto:${esc(it.email)}">${esc(it.email)}</a>`:"", it.phone?esc(it.phone):"", esc(it.city)])}
     ${meta([`${n(it.listings)} listings`, `Joined ${esc(fmtDate(it.created))}`])}
     ${it.suspended?`<div class="tags"><span class="tag bad">Suspended</span></div>`:""}`,
    `<button class="btn sm ghost" type="button" data-go="talent|talent|all|${esc(it.email)}">Their listings</button>` +
    (it.suspended ? btn("talentProfiles",it.id,"unsuspend","Lift suspension","good") : ask("talentProfiles",it.id,"suspend","Suspend","danger")))
};

/* — wiring — */
function wire(){
  $$("[data-reload]").forEach(b=> b.onclick=()=> b.dataset.reload==="overview" ? load("overview",true) : load(b.dataset.reload,true));
  $$("[data-go]").forEach(b=> b.onclick=()=>{ const [tab,kind,f,q]=b.dataset.go.split("|");
    if (tab==="offers") V.sub.offers=kind; if (tab==="enquiries") V.sub.enquiries=kind; if (tab==="accounts") V.sub.accounts=kind;
    if (kind && q!==undefined) V.query[kind]=q;
    openTab(tab, kind||null, f||"all"); });
  $$("[data-f]").forEach(b=> b.onclick=()=>{ const [k,f]=b.dataset.f.split("|"); V.filter[k]=f; render(); });
  $$("[data-q]").forEach(i=>{ i.value = V.query[i.dataset.q]||""; i.oninput=()=>{ V.query[i.dataset.q]=i.value; render(); }; });
  $$("[data-sort]").forEach(s=> s.onchange=()=>{ V.sort[s.dataset.sort]=s.value; render(); });

function fld(k, label, type, o){
  o=o||{};
  const req = o.req ? ` <i>*</i>` : "", full = o.full ? " full" : "", hint = o.hint ? `<p class="hint">${o.hint}</p>` : "";
  let input;
  if (type==="textarea") input = `<textarea id="v-${k}" maxlength="${o.max||4000}"></textarea>`;
  else if (type==="select") input = `<select id="v-${k}"><option value="">Choose…</option>${(o.opts||[]).map(x=>`<option>${esc(x)}</option>`).join("")}</select>`;
  else if (type==="chips") input = `<div class="chips" data-chips="${k}">${(o.opts||[]).map(x=>`<button type="button" class="chip" data-chip="${k}" data-v="${esc(x)}" aria-pressed="${F.chips[k].includes(x)}">${esc(x)}</button>`).join("")}</div>`;
  else input = `<input id="v-${k}" type="${type}" ${type==="number"?'inputmode="numeric" min="0"':""} ${o.list?`list="dl-${k}"`:""} maxlength="${o.max||200}" ${o.ph?`placeholder="${esc(o.ph)}"`:""}>${o.list?`<datalist id="dl-${k}">${o.list.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>`:""}`;
  return `<div class="fld${full}" data-f="v-${k}"><label for="v-${k}">${label}${req}</label>${input}${hint}</div>`;
}

    <div class="card"><h3>Photos</h3><p class="lede">A cover photo is required. Large photos are shrunk before upload.</p>
      <div class="fld full" data-f="hero"><label>Cover photo <i>*</i></label><div class="drop"><p>JPG or PNG, landscape works best.</p><button class="btn sm" type="button" data-pick="hero">Choose cover photo</button></div><div class="pics" id="heroPics"></div></div>
      <div class="fld full" style="margin-top:14px"><label>Gallery</label><div class="drop"><p>Up to 24 more photos.</p><button class="btn sm" type="button" data-pick="gallery">Add photos</button></div><div class="pics" id="galPics"></div></div></div>

/* photos: shrink in the browser, upload one at a time, keep only Wix Media URLs */
let pickFor = "hero", pumping = false, pseq = 0; const queue = [];
function shrink(file){
  return new Promise((res, rej)=>{
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = ()=>{ const s=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      let q=.82, out=c.toDataURL("image/jpeg",q); while(out.length>900000 && q>.45){ q-=.08; out=c.toDataURL("image/jpeg",q); } res(out); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error("That file isn't an image we can open. Try a JPG or PNG.")); };
    img.src = url;
  });
}
$("#filePick").onchange = async e=>{
  const files = Array.from(e.target.files||[]);
  for (const f of (pickFor==="gallery" ? files.slice(0, 24-photos.gallery.length) : files.slice(0,1))){
    try{
      const p = { uid:"p"+(++pseq), preview: await shrink(f), name:f.name, status:"up", url:"" };
      if (pickFor==="gallery") photos.gallery.push(p); else photos.hero = p;
      queue.push(p);
    }catch(err){ showFormErr(err.message); }
  }
  renderPics(); pump();
};
async function pump(){
  if (pumping) return; const p = queue.shift(); if (!p) return;
  pumping = true;
  const r = await call("upload", p.preview, p.name);
  pumping = false;
  if (r.ok && r.url){ p.status="ok"; p.url=r.url; } else { p.status="fail"; showFormErr(r.error||"A photo didn't upload. Remove it and try again."); }
  renderPics(); pump();
}
function renderPics(){
  const pic = (p, big, where) => `<span class="pic${big?" big":""} ${p.status==="up"?"up":p.status==="fail"?"fail":""}" style="background-image:url('${p.preview}')"><button type="button" aria-label="Remove photo" data-rm="${where}|${p.uid}">×</button></span>`;
  const h=$("#heroPics"), g=$("#galPics");
  if (h) h.innerHTML = photos.hero ? pic(photos.hero, true, "hero") : "";
  if (g) g.innerHTML = photos.gallery.map(p=>pic(p,false,"gallery")).join("");
  $$("[data-rm]").forEach(b=> b.onclick=()=>{ const [w,uid]=b.dataset.rm.split("|");
    if (w==="hero") photos.hero=null; else photos.gallery=photos.gallery.filter(p=>p.uid!==uid); renderPics(); });
}
function showFormErr(t){ formErr=t||""; const b=$("#formErr"); if (b) b.innerHTML = formErr ? `<div class="formerr" role="alert">${esc(formErr)}</div>` : ""; }
const val = k => { const el=$("#v-"+k); return el ? el.value.trim() : ""; };
const chk = k => { const el=$("#v-"+k); return !!(el && el.checked); };
async function submitVenue(){
  if (saving) return;
  $$(".fld.bad").forEach(x=>x.classList.remove("bad"));
  const missing=[];
  if (!val("venueName")){ missing.push("venue name"); $('[data-f="v-venueName"]').classList.add("bad"); }
  if (!photos.hero || photos.hero.status==="fail"){ missing.push("cover photo"); $('[data-f="hero"]').classList.add("bad"); }
  const ce = val("claimEmail");
  if (ce && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(ce)){ missing.push("a valid owner's email"); $('[data-f="v-claimEmail"]').classList.add("bad"); }
  if (missing.length){ showFormErr("Still needed: " + missing.join(", ") + "."); return; }
  if ([photos.hero, ...photos.gallery].some(p=>p && p.status==="up")){ showFormErr("Photos are still uploading — try again in a moment."); return; }
  const keys = ["venueName","city","address","locationType","tagline","description","maxGuests","pricePerGuest","minGuests","prepSuites",
    "startingPrice","pricePerPackage","depositToHold","cancellationNotice","cateringPolicy","alcoholPolicy","parking","distance","websiteUrl",
    "phoneContact","venueLandline","emailContact"];
  const payload = {}; keys.forEach(k=> payload[k]=val(k));
  Object.assign(payload, F.chips, { showPhone:chk("showPhone"), showEmail:chk("showEmail"), showAddress:chk("showAddress"), showPricing:chk("showPricing") });
  saving = true; showFormErr(""); const b=$("#saveVenue"); b.disabled=true; b.textContent="Adding…";
  const r = await call("createVenue", payload, photos.hero.url, photos.gallery.filter(p=>p.status==="ok").map(p=>p.url),
                       { email: ce, invite: chk("invite"), visible: chk("visible") });
  saving = false;
  if (!r.ok){ b.disabled=false; b.textContent="Add venue"; showFormErr(r.error); return; }
  const D = DATA.venues = DATA.venues || {}; D.items = D.items || []; D.items.unshift(r.item);
  OVERVIEW = null;
  flash(`${r.item.title} added.` + (r.emailed===true ? " The owner was emailed." : r.emailed===false ? " (The invitation email couldn't be sent — check the triggered email.)" : ""));
  resetForm();
}
