<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
/* ── Pixel Pals build standards ─────────────────────────────────────
   No visible scrollbars anywhere (everything still scrolls), media never
   wider than its box, 16px form text on phones so iOS doesn't zoom.
   Height: the reporter at the end of this file (setHeight → site-wide listener). */
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0;height:0;display:none}
img,video,canvas{max-width:100%}
@media (max-width:760px){input,select,textarea{font-size:16px!important}}

/* Same chrome as the builder, so the couple's area feels like one tool. */
:root{
  --ink:#14161A; --panel:#1C1F25; --panel-2:#232730; --line:#2A2E36; --line-soft:#22252C;
  --text:#E8E6E1; --dim:#9298A3; --dimmer:#6B7280;
  --gold:#BD9B68; --gold-hi:#CDB184; --gold-soft:rgba(189,155,104,.15);
  --ok:#7FB496; --ok-soft:rgba(127,180,150,.14); --no:#D9736B; --no-soft:rgba(217,115,107,.13);
  --r:12px;
  --ui:'Manrope',system-ui,-apple-system,sans-serif; --ui-ar:'IBM Plex Sans Arabic','Manrope',sans-serif;
  --disp:'Cormorant Garamond',Georgia,serif; --disp-ar:'Amiri',serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--text);font:14px/1.55 var(--ui);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body[dir=rtl]{font-family:var(--ui-ar)}
button,input,a{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:1120px;margin:0 auto;padding:22px 20px 36px}
.top{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;padding-bottom:22px;margin-bottom:22px;border-bottom:1px solid var(--line)}
.top .who{flex:1;min-width:240px}
.names{font:600 clamp(30px,4.4vw,44px)/1.08 var(--disp);margin:0 0 6px;letter-spacing:.005em}
body[dir=rtl] .names{font-family:var(--disp-ar);font-weight:700;line-height:1.3}
.meta{color:var(--dim);margin:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:99px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--panel)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--dimmer)}
.chip.live{border-color:rgba(127,180,150,.45);background:var(--ok-soft);color:#BFE0CC}
.chip.live i{background:var(--ok)}
.chip.draft{border-color:rgba(189,155,104,.45);background:var(--gold-soft);color:#E9D6B6}
.chip.draft i{background:var(--gold)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel);
  padding:9px 15px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13px;text-decoration:none;min-height:40px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--panel-2);border-color:#353A44}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#17130A}
.btn.primary:hover{background:var(--gold-hi);border-color:var(--gold-hi)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;min-height:34px;font-size:12.5px}
.btn svg{width:15px;height:15px;flex:none}

.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media(max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card h2{font-size:15px;font-weight:700;margin:0 0 4px;letter-spacing:-.005em}
.card .sub{color:var(--dim);margin:0 0 16px;font-size:13px}
.card.wide{grid-column:1/-1}

.link{display:flex;gap:8px;align-items:stretch;margin-bottom:12px}
@media(max-width:420px){.link{flex-wrap:wrap}.link input{flex-basis:100%}}
.link input{flex:1;min-width:0;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 12px;
  font:13px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row + .row{margin-top:10px}
.note{font-size:12.5px;color:var(--dim);margin:12px 0 0}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--ink);border:1px solid var(--line-soft);border-radius:10px;padding:12px 12px 10px}
.stat b{display:block;font:600 30px/1 var(--disp);font-variant-numeric:lining-nums tabular-nums}
.stat span{display:block;font-size:12px;color:var(--dim);margin-top:6px}
.stat.ok b{color:#A9D6BB}.stat.no b{color:#E7A39D}.stat.wait b{color:#E0C9A2}
.bar{height:8px;border-radius:99px;background:var(--ink);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--ok)}.bar .b-no{background:var(--no)}
.heads{font-size:13px;color:var(--dim);margin:10px 0 0}
.heads b{color:var(--text)}

.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line-soft)}
.list li:first-child{border-top:none;padding-top:2px}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--panel-2);color:var(--dim)}
.who2{flex:1;min-width:0}
.who2 b{display:block;font-weight:600}
.who2 p{margin:3px 0 0;color:var(--dim);font-size:13px;overflow-wrap:anywhere}
.tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:#BFE0CC}.tag.no{background:var(--no-soft);color:#F0B8B2}
.tag.off{background:var(--panel-2);color:var(--dim);font-weight:600}
.when{font-size:12px;color:var(--dimmer);white-space:nowrap}
.empty{color:var(--dim);font-size:13.5px;padding:6px 0 2px;margin:0}

.hero-empty{text-align:center;padding:48px 20px}
.hero-empty h1{font:600 clamp(28px,4vw,40px)/1.1 var(--disp);margin:0 0 10px}
body[dir=rtl] .hero-empty h1{font-family:var(--disp-ar);font-weight:700}
.hero-empty p{color:var(--dim);margin:0 auto 22px;max-width:44ch}
.toast{margin:0 0 16px;padding:11px 14px;border-radius:10px;background:var(--no-soft);border:1px solid rgba(217,115,107,.35);color:#F0B8B2;font-size:13px}
.skel{height:260px;border-radius:var(--r);background:linear-gradient(90deg,var(--panel) 0%,var(--panel-2) 50%,var(--panel) 100%);background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* ── Shortlist (inside the dashboard) ── */
.sl-wrap{padding-top:0}
.sl-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:22px;margin-bottom:6px}
.sl-head h2{font:600 clamp(24px,3.4vw,32px)/1.15 var(--disp);margin:0;flex:1}
body[dir=rtl] .sl-head h2{font-family:var(--disp-ar);font-weight:700}
.sl-sub{color:var(--dim);margin:0 0 14px}
.sl-seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sl-seg button{border:0;background:var(--ink);padding:9px 13px;font-weight:600;font-size:13px;cursor:pointer;color:var(--dim)}
.sl-seg button[aria-pressed=true]{background:var(--gold-soft);color:var(--text)}
.sl-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.sl-f{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--dim)}
.sl-f b{color:var(--text);margin-inline-start:4px}
.sl-f[aria-pressed=true]{border-color:var(--gold);background:var(--gold-soft);color:var(--text)}
.sl-tools .sp{flex:1}
.sl-list{display:grid;gap:10px}
.sl-item{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px 14px;align-items:start}
.sl-item.favourite{border-color:rgba(189,155,104,.55)}
.sl-item.booked{border-color:rgba(127,180,150,.5)}
.sl-item.notForUs{opacity:.72}
.sl-item .ph{width:72px;height:72px;border-radius:10px;background:var(--panel-2) center/cover no-repeat}
.sl-item h4{margin:0;font-size:15.5px;font-weight:700}
.sl-item a.ph{display:block;cursor:pointer;transition:opacity .15s}
.sl-item a.ph:hover{opacity:.85}
.sl-item h4 a{color:inherit;text-decoration:none;cursor:pointer}
.sl-item h4 a:hover{color:var(--gold-hi,#CDB184);text-decoration:underline;text-underline-offset:3px}
.sl-item .meta{color:var(--dim);font-size:12.5px;margin-top:2px}
.sl-item .gone{display:inline-block;margin-top:6px;font-size:12px;color:#F0B8B2;background:var(--no-soft);border-radius:99px;padding:2px 9px}
.sl-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.sl-acts .wa{border-color:rgba(79,181,122,.45);color:#B8E6CA}
.sl-side{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.sl-side select{font:inherit;background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:6px 10px;min-height:34px;font-size:13px;font-weight:600;color:var(--text)}
.sl-side select.favourite{border-color:var(--gold);color:#E9D6B6}
.sl-side select.booked{border-color:rgba(127,180,150,.6);color:#BFE0CC}
.sl-side select.notForUs{color:var(--dim)}
.sl-side .q{font-size:12.5px;color:var(--dim)}
.sl-note{grid-column:2/-1}
.sl-note textarea{font:inherit;font-size:14px;width:100%;background:var(--ink);border:1px solid var(--line-soft);border-radius:9px;padding:8px 10px;min-height:38px;resize:vertical;font-size:14px;line-height:1.45;color:var(--text)}
.sl-note textarea:focus{outline:none;border-color:var(--gold)}
.sl-note .saved{font-size:11.5px;color:var(--dimmer);margin-top:3px;min-height:15px}
.sl-empty{background:var(--panel);border:1px dashed var(--line);border-radius:var(--r);padding:24px 16px;text-align:center;color:var(--dim)}
.sl-empty b{display:block;color:var(--text);margin-bottom:4px;font-size:15px}
.sl-err{color:#F0B8B2;font-size:13px;margin:8px 0 0}
@media(max-width:600px){
  .sl-item{grid-template-columns:56px 1fr}
  .sl-item .ph{width:56px;height:56px}
  .sl-side{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}
  .sl-note{grid-column:1/-1}
}
</style>
<style id="pp-layout">
/* ── Pixel Pals layout safeguards ─────────────────────────────────────
   Transparent page so the Wix section shows through seamlessly, sturdy form
   controls on phones, long words wrap instead of widening the page, and a
   safety space at the end so nothing is ever cut off. */
html,body{background:transparent!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-wrap:break-word}
input,select,textarea,button{max-width:100%}
table{max-width:100%}
/* iOS draws date fields wider and taller than other inputs; make them behave. */
input[type=date],input[type=time],input[type=datetime-local]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;display:block}
input[type=date]::-webkit-date-and-time-value{text-align:start;min-height:1.4em}
/* Save bars sit in the flow: a sticky bar needs a solid background, and the page has none. */
.savebar{position:static!important;background:transparent!important}
/* Width: 80% of the frame on wide screens, never narrower than before (1120px). */
.wrap{width:max(80%, min(100%, 1120px))!important;max-width:none!important;margin-left:auto!important;margin-right:auto!important}
@media (max-width:1100px){.wrap{padding-left:20px!important;padding-right:20px!important}}
@media (max-width:600px){.wrap{padding-left:14px!important;padding-right:14px!important}}
/* Safety space under the content (counted by the height reporter). */
.pp-safe-space{display:block;height:140px}
@media (max-width:760px){.pp-safe-space{height:calc(180px + env(safe-area-inset-bottom, 0px))}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="skel"></div></div>
<div class="wrap sl-wrap" id="slRoot" hidden></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let D = null, err = "";
let ui = (()=>{ try{ return localStorage.getItem("3orsna:uiLang") || "en"; }catch(e){ return "en"; } })();

const T = {
 en:{ lang:"العربية", daysTo:n=>n===1?"1 day to go":`${n} days to go`, today:"It's today", after:"Married",
   live:"Published", draft:"Draft", page:"Your page", pageSubLive:"This is the address you share with guests.",
   pageSubDraft:"Only you can see it until you publish.", copy:"Copy link", copied:"Copied", open:"Open page",
   preview:"Preview", share:"Share on WhatsApp", edit:"Edit page", publish:"Publish page", unpublish:"Unpublish",
   unpubNote:"Unpublishing hides the page from guests straight away. Links keep working again once you republish.",
   replies:"Replies", repliesSub:"Updated every time a guest answers.", coming:"Coming", notComing:"Not coming",
   waiting:"Waiting", heads:n=>`<b>${n}</b> ${n===1?"person":"people"} coming in total`, closes:d=>`Replies close on ${d}.`,
   closed:"Replies are turned off in your page settings.", guests:"Guest list",
   guestsSub:n=>n?`${n} ${n===1?"guest":"guests"} on your list.`:"Add guests and invite them on WhatsApp.",
   manage:"Manage guests", notOnList:n=>`${n} ${n===1?"reply came":"replies came"} from people not on your list.`,
   latest:"Latest replies", none:"No replies yet. They'll appear here as guests answer.",
   yes:n=>n>1?`Coming · ${n}`:"Coming", no:"Not coming", viaWa:"via WhatsApp", offList:"not on list",
   startH:"Your wedding page", startP:"Design your invitation, share one link, and watch the replies come in here.",
   start:"Start your page", shareText:"You're invited to our wedding 💛", error:"Something went wrong. Please try again.",
   ago:{now:"just now", m:n=>`${n} min ago`, h:n=>`${n} h ago`, d:n=>`${n} d ago`} },
 ar:{ lang:"English", daysTo:n=>`باقٍ ${n} يوم`, today:"اليوم هو اليوم", after:"تزوّجنا",
   live:"منشورة", draft:"مسودة", page:"صفحتكم", pageSubLive:"هذا هو الرابط الذي تشاركونه مع الضيوف.",
   pageSubDraft:"أنتم فقط ترونها حتى تنشروها.", copy:"نسخ الرابط", copied:"تم النسخ", open:"فتح الصفحة",
   preview:"معاينة", share:"مشاركة عبر واتساب", edit:"تعديل الصفحة", publish:"نشر الصفحة", unpublish:"إلغاء النشر",
   unpubNote:"إلغاء النشر يخفي الصفحة عن الضيوف فوراً. تعود الروابط للعمل عند إعادة النشر.",
   replies:"الردود", repliesSub:"تتحدّث مع كل رد من الضيوف.", coming:"سيحضرون", notComing:"معتذرون",
   waiting:"بانتظار الرد", heads:n=>`<b>${n}</b> شخص سيحضرون إجمالاً`, closes:d=>`تُغلق الردود في ${d}.`,
   closed:"الردود متوقفة من إعدادات صفحتكم.", guests:"قائمة المدعوين",
   guestsSub:n=>n?`${n} ضيف في قائمتكم.`:"أضيفوا الضيوف وادعوهم عبر واتساب.",
   manage:"إدارة الضيوف", notOnList:n=>`${n} رد من أشخاص ليسوا في قائمتكم.`,
   latest:"أحدث الردود", none:"لا ردود بعد. ستظهر هنا عند رد الضيوف.",
   yes:n=>n>1?`سيحضر · ${n}`:"سيحضر", no:"معتذر", viaWa:"عبر واتساب", offList:"خارج القائمة",
   startH:"صفحة زفافكم", startP:"صمّموا دعوتكم، وشاركوا رابطاً واحداً، وتابعوا الردود هنا.",
   start:"ابدأوا صفحتكم", shareText:"أنتم مدعوون لحضور زفافنا 💛", error:"حدث خطأ. حاولوا مرة أخرى.",
   ago:{now:"الآن", m:n=>`قبل ${n} دقيقة`, h:n=>`قبل ${n} ساعة`, d:n=>`قبل ${n} يوم`} }
};
const t = () => T[ui];
const num = n => Number(n||0).toLocaleString(ui==="ar" ? "ar-JO" : "en-GB");
const fmtDate = iso => { if(!iso) return ""; const d=new Date(iso+"T12:00:00"); if(isNaN(d)) return "";
  return d.toLocaleDateString(ui==="ar"?"ar-JO":"en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"}); };
function ago(at){
  const s=(Date.now()-new Date(at).getTime())/1000, a=t().ago;
  if (!isFinite(s)) return ""; if (s<60) return a.now; if (s<3600) return a.m(num(Math.floor(s/60)));
  if (s<86400) return a.h(num(Math.floor(s/3600))); return a.d(num(Math.floor(s/86400)));
}
const ICON = {
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
  open:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>',
  wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .1-1.3c0-.1-.2-.2-.4-.3Z"/></svg>'
};

/* Height: the Pixel Pals reporter at the end of this file (setHeight → site-wide listener). */
const post = m => { try{ window.parent.postMessage(m,"*"); }catch(e){} };

function copyText(v){
  const done = ()=>{ const b=$("#copyBtn"); if(!b) return; const k=b.innerHTML; b.innerHTML=ICON.copy+esc(t().copied); setTimeout(()=>{ if($("#copyBtn")) $("#copyBtn").innerHTML=k; },1600); };
  if (navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(v).then(done).catch(()=>{ legacy(v); done(); }); return; }
  legacy(v); done();
}
function legacy(v){ const i=$("#linkField"); if(!i) return; i.focus(); i.select(); try{ document.execCommand("copy"); }catch(e){} i.blur(); }

function render(){
  const L = t(), app = $("#app");
  document.documentElement.lang = ui; document.body.dir = ui==="ar" ? "rtl" : "ltr";
  if (!D) return;
  const langBtn = `<button class="btn ghost sm" id="langBtn" type="button">${L.lang}</button>`;
  const toast = err ? `<p class="toast" role="alert">${esc(err)}</p>` : "";

  if (!D.hasWedding){
    app.innerHTML = `<div class="top" style="border:none;margin:0;padding:0;justify-content:flex-end">${langBtn}</div>${toast}
      <div class="card hero-empty"><h1>${L.startH}</h1><p>${L.startP}</p>
      <button class="btn primary" type="button" data-nav="builder">${L.start}</button></div>`;
    return wire();
  }

  const ar = ui==="ar";
  const A = ar ? (D.brideAr||D.bride) : (D.bride||D.brideAr), B = ar ? (D.groomAr||D.groom) : (D.groom||D.groomAr);
  const names = [A,B].filter(Boolean).join(ar ? " و" : " & ") || "—";
  const live = D.status === "published";
  let count = "";
  if (D.date){
    const days = Math.ceil((new Date(D.date+"T00:00:00") - new Date(new Date().toDateString()))/86400000);
    count = days > 0 ? L.daysTo(num(days)) : days === 0 ? L.today : L.after;
  }
  const where = [D.venue, D.city].filter(Boolean).join(ar ? "، " : ", ");
  const s = D.stats || {};
  const answered = (s.confirmed||0) + (s.declined||0), total = Math.max(answered + (s.pending||0), 1);
  const url = D.publicUrl || "";
  const previewUrl = url ? `${url}?preview=1` : "";
  const shareHref = `https://wa.me/?text=${encodeURIComponent(`${L.shareText}\n${url}`)}`;

  app.innerHTML = `
  <div class="top">
    <div class="who">
      <h1 class="names">${esc(names)}</h1>
      <p class="meta">${esc([fmtDate(D.date), where].filter(Boolean).join(" · "))}</p>
      <div class="chips"><span class="chip ${live?"live":"draft"}"><i></i>${live?L.live:L.draft}</span>${count?`<span class="chip">${esc(count)}</span>`:""}</div>
    </div>
    ${langBtn}
  </div>
  ${toast}
  <div class="grid">
    <section class="card">
      <h2>${L.page}</h2><p class="sub">${live?L.pageSubLive:L.pageSubDraft}</p>
      ${url ? `<div class="link"><input id="linkField" type="text" readonly value="${esc(url)}" aria-label="${esc(L.page)}">
        <button class="btn" id="copyBtn" type="button">${ICON.copy}${L.copy}</button></div>` : ""}
      <div class="row">
        <button class="btn primary" type="button" data-nav="builder">${L.edit}</button>
        ${url ? (live ? `<a class="btn" href="${esc(url)}" target="_blank" rel="noopener">${ICON.open}${L.open}</a>`
                      : `<a class="btn" href="${esc(previewUrl)}" target="_blank" rel="noopener">${ICON.open}${L.preview}</a>`) : ""}
        ${live && url ? `<a class="btn" href="${esc(shareHref)}" target="_blank" rel="noopener">${ICON.wa}${L.share}</a>` : ""}
      </div>
      <div class="row">
        ${D.slug ? (live ? `<button class="btn ghost sm" type="button" id="pubToggle" data-on="0">${L.unpublish}</button>`
                         : `<button class="btn sm" type="button" id="pubToggle" data-on="1">${L.publish}</button>`) : ""}
      </div>
      ${live ? `<p class="note">${L.unpubNote}</p>` : ""}
    </section>

    <section class="card">
      <h2>${L.replies}</h2><p class="sub">${L.repliesSub}</p>
      <div class="stats">
        <div class="stat ok"><b>${num(s.confirmed)}</b><span>${L.coming}</span></div>
        <div class="stat no"><b>${num(s.declined)}</b><span>${L.notComing}</span></div>
        <div class="stat wait"><b>${D.guestListEnabled?num(s.pending):"—"}</b><span>${L.waiting}</span></div>
      </div>
      <div class="bar" role="img" aria-label="${num(answered)} / ${num(total)}">
        <i class="b-ok" style="width:${(s.confirmed||0)/total*100}%"></i><i class="b-no" style="width:${(s.declined||0)/total*100}%"></i></div>
      <p class="heads">${L.heads(num(s.heads))}</p>
      <p class="note">${D.rsvpOn ? (D.rsvpDeadline ? L.closes(esc(fmtDate(D.rsvpDeadline))) : "") : L.closed}</p>
    </section>

    ${D.guestListEnabled ? `<section class="card">
      <h2>${L.guests}</h2><p class="sub">${L.guestsSub(s.guests?num(s.guests):0)}</p>
      <button class="btn primary" type="button" data-nav="guests">${L.manage}</button>
      ${s.notOnList ? `<p class="note">${L.notOnList(num(s.notOnList))}</p>` : ""}
    </section>` : ""}

    <section class="card${D.guestListEnabled?"":" wide"}">
      <h2>${L.latest}</h2>
      ${(D.recent||[]).length ? `<ul class="list">${D.recent.map(r=>`
        <li><span class="av" aria-hidden="true">${esc((r.name||"?").trim().charAt(0).toUpperCase())}</span>
          <div class="who2"><b>${esc(r.name)}</b>
            ${r.message?`<p>“${esc(r.message)}”</p>`:""}
            <p>${r.source==="whatsapp"?L.viaWa+" · ":""}${esc(ago(r.at))}${!r.onList && D.guestListEnabled?` · <span class="tag off">${L.offList}</span>`:""}</p></div>
          <span class="tag ${r.attending?"ok":"no"}">${r.attending?L.yes(r.partySize):L.no}</span></li>`).join("")}</ul>`
        : `<p class="empty">${L.none}</p>`}
    </section>
  </div>`;
  wire();
}

function wire(){
  const lb = $("#langBtn");
  if (lb) lb.onclick = ()=>{ ui = ui==="ar" ? "en" : "ar"; try{ localStorage.setItem("3orsna:uiLang",ui); }catch(e){} render(); slRender(); };
  document.querySelectorAll("[data-nav]").forEach(b=> b.onclick = ()=> post({type:"3orsna:nav", to:b.dataset.nav}));
  const cb = $("#copyBtn"); if (cb) cb.onclick = ()=> copyText(D.publicUrl);
  const pt = $("#pubToggle");
  if (pt) pt.onclick = ()=>{ pt.disabled = true; err = ""; post({type:"3orsna:setPublished", on: pt.dataset.on==="1"}); };
 
}

window.addEventListener("message", e=>{
  const d = e.data; if (!d || typeof d!=="object") return;
  if (d.type === "3orsna:dash"){ D = d.data || {hasWedding:false}; err = ""; render(); }
  if (d.type === "3orsna:error"){ err = t().error; render(); }
});
document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="visible" && D){ post({type:"3orsna:refresh"}); if (SL.asked) post({type:"sl:refresh"}); } });

/* ══════════ Shortlist — venues and talent the couple is considering ══════════
   Lives under the dashboard in this same iframe; drawn into #slRoot on its own
   so dashboard updates never wipe what the couple is typing. */
const SLT = {
 en:{ title:"Your shortlist", sub:"The venues and talent you've sent an enquiry to. Mark each one and keep notes as you decide.", enquired:"Enquired",
   find:"Find venues and talent", ph:"Search by name or type — e.g. photographer", all:"All", venues:"Venues", talent:"Talent", go:"Search",
   add:"+ Add", added:"On your list", none:"Nothing found. Try another name or type.", browse:"Search, or press Search to browse everything.",
   st:{ considering:"Considering", favourite:"Favourite", booked:"Booked", notForUs:"Not for us" },
   view:"View page", call:"Call", email:"Email", remove:"Remove", removeQ:"Remove from your list?", yes:"Yes, remove", no:"Keep",
   note:"Notes — price quoted, dates offered, anything to remember", saved:"Saved", gone:"No longer listed",
   empty:"No enquiries yet", emptyP:"When you send an enquiry to a venue or talent, they'll appear here.", noMatch:"Nothing in this filter.", err:"That didn't save. Try again." },
 ar:{ title:"قائمتكم المختصرة", sub:"القاعات ومقدّمو الخدمات الذين أرسلتم لهم استفساراً. صنّفوهم ودوّنوا ملاحظاتكم.", enquired:"تاريخ الاستفسار",
   find:"ابحثوا عن قاعات ومقدّمي خدمات", ph:"ابحثوا بالاسم أو النوع — مثلاً مصوّر", all:"الكل", venues:"القاعات", talent:"مقدّمو الخدمات", go:"بحث",
   add:"+ إضافة", added:"في قائمتكم", none:"لا نتائج. جرّبوا اسماً أو نوعاً آخر.", browse:"ابحثوا، أو اضغطوا بحث لعرض الكل.",
   st:{ considering:"قيد التفكير", favourite:"مفضّل", booked:"تم الحجز", notForUs:"ليس لنا" },
   view:"عرض الصفحة", call:"اتصال", email:"بريد", remove:"حذف", removeQ:"حذف من قائمتكم؟", yes:"نعم، احذف", no:"إبقاء",
   note:"ملاحظات — السعر المعروض، المواعيد، أي شيء للتذكّر", saved:"تم الحفظ", gone:"لم يعد متاحاً",
   empty:"لا استفسارات بعد", emptyP:"عندما ترسلون استفساراً لقاعة أو مقدّم خدمة، سيظهر هنا.", noMatch:"لا شيء في هذا التصنيف.", err:"تعذّر الحفظ. حاولوا مجدداً." }
};
const SL = { items:null, err:"", results:null, q:"", kind:"", filter:"all", typeF:"all", searching:false, confirmRm:null, msg:"", notes:{}, asked:false };
const slWa = p => { let d=String(p||"").replace(/[^\d+]/g,""); if (d.startsWith("00")) d="+"+d.slice(2); if (d.startsWith("0")) d="+962"+d.slice(1); return d.replace(/^\+/,""); };

function slRender(){
  const root=$("#slRoot"); if (!root || !SL.asked) return;
  root.hidden=false;
  const L=SLT[ui], focus=document.activeElement && root.contains(document.activeElement) ? document.activeElement.id : "";
  const items=SL.items||[];
  const inType=items.filter(i=>SL.typeF==="all"||i.type===SL.typeF);
  const count=k=>inType.filter(i=>k==="all"||i.status===k).length;
  const shown=inType.filter(i=>SL.filter==="all"||i.status===SL.filter);
  root.innerHTML = `
  <div class="sl-head"><h2>${L.title}</h2></div><p class="sl-sub">${L.sub}</p>

  ${SL.items===null ? (SL.err?`<div class="sl-empty"><b>${L.title}</b>${esc(SL.err)}</div>`:"")
   : !items.length ? `<div class="sl-empty"><b>${L.empty}</b>${L.emptyP}</div>`
   : `<div class="sl-tools">
      ${["all","considering","favourite","booked","notForUs"].map(k=>`<button type="button" class="sl-f" data-slf="${k}" aria-pressed="${SL.filter===k}">${k==="all"?L.all:L.st[k]}<b>${count(k)}</b></button>`).join("")}
      <span class="sp"></span>
      <div class="sl-seg">${[["all",L.all],["venue",L.venues],["talent",L.talent]].map(([k,l])=>`<button type="button" data-sltf="${k}" aria-pressed="${SL.typeF===k}">${l}</button>`).join("")}</div>
    </div>
    ${shown.length ? `<div class="sl-list">${shown.map(slItem).join("")}</div>` : `<div class="sl-empty"><b>${L.noMatch}</b></div>`}`}`;
  slWire();
  if (focus && document.getElementById(focus)) document.getElementById(focus).focus();
 
}
function slItem(i){
  const L=SLT[ui], ns=SL.notes[i.id]||{};
  const open = i.available && i.link;                  // photo, name and button all go to the listing's page
  const bg = i.image?`background-image:url('${esc(i.image)}')`:"";
  return `<div class="sl-item ${i.status}" data-id="${esc(i.id)}">
    ${open ? `<a class="ph" href="#" role="button" data-slopen="${esc(i.link)}" style="${bg}" aria-label="${esc(L.view+": "+i.title)}"></a>`
           : `<span class="ph" style="${bg}"></span>`}
    <div><h4>${open ? `<a href="#" data-slopen="${esc(i.link)}">${esc(i.title)}</a>` : esc(i.title)}</h4><div class="meta">${esc([i.category,i.city].filter(Boolean).join(" · "))}</div>
      ${!i.available?`<span class="gone">${L.gone}</span>`:""}
      <div class="sl-acts">
        ${i.available && i.link ? `<button class="btn sm" type="button" data-slopen="${esc(i.link)}">${L.view}</button>` : ""}
        ${i.phone ? `<a class="btn sm" href="tel:${esc(i.phone)}">${L.call}</a><a class="btn sm wa" href="https://wa.me/${slWa(i.phone)}" target="_blank" rel="noopener">WhatsApp</a>` : ""}
        ${i.email ? `<a class="btn sm" href="mailto:${esc(i.email)}" target="_blank" rel="noopener">${L.email}</a>` : ""}
      </div></div>
    <div class="sl-side">
      <select class="${i.status}" data-slstatus="${esc(i.id)}" aria-label="Status">${Object.entries(L.st).map(([k,l])=>`<option value="${k}"${k===i.status?" selected":""}>${l}</option>`).join("")}</select>
      ${i.enquiredAt ? `<span class="q">${L.enquired} ${esc(new Date(i.enquiredAt).toLocaleDateString(ui==="ar"?"ar-JO":"en-GB",{day:"numeric",month:"short",year:"numeric"}))}</span>` : ""}
    </div>
    <div class="sl-note"><textarea data-slnote="${esc(i.id)}" rows="1" maxlength="1000" placeholder="${esc(L.note)}">${esc(i.note)}</textarea>
      <div class="saved">${ns.err?`<span style="color:#F0B8B2">${esc(ns.err)}</span>`:ns.saved?L.saved:""}</div></div>
  </div>`;
}
function slWire(){
  const R=$("#slRoot"), all=s=>R.querySelectorAll(s);
  all("[data-slf]").forEach(b=>b.onclick=()=>{ SL.filter=b.dataset.slf; slRender(); });
  all("[data-sltf]").forEach(b=>b.onclick=()=>{ SL.typeF=b.dataset.sltf; slRender(); });
  all("[data-slopen]").forEach(b=>b.onclick=e=>{ e.preventDefault(); post({type:"sl:open",url:b.dataset.slopen}); });
  all("[data-slstatus]").forEach(s=>s.onchange=()=>{
    const i=SL.items.find(x=>x.id===s.dataset.slstatus); if(!i) return; i.prev=i.status; i.status=s.value; slRender();
    post({type:"sl:update",id:i.id,patch:{status:i.status}}); });
  all("[data-slnote]").forEach(a=>{
    const grow=()=>{ a.style.height="auto"; a.style.height=Math.max(38,a.scrollHeight)+"px"; };
    grow(); a.oninput=grow;
    a.onblur=()=>{ const i=SL.items.find(x=>x.id===a.dataset.slnote); if(!i||a.value===i.note) return; i.note=a.value; SL.notes[i.id]={};
      post({type:"sl:update",id:i.id,patch:{note:i.note}}); };
  });
}
window.addEventListener("message", e=>{
  const d=e.data; if (!d || typeof d!=="object") return;
  if (d.type==="3orsna:dash" && !SL.asked){ SL.asked=true; post({type:"sl:ready"}); slRender(); }
  if (d.type==="sl:data"){ if (d.ok){ SL.items=d.items||[]; SL.err=""; } else SL.err=d.error||""; slRender(); }
  if (d.type==="sl:saved"){
    const i=SL.items && SL.items.find(x=>x.id===d.id);
    if (d.ok){ if (i && d.patch && d.patch.note!==undefined) SL.notes[i.id]={saved:true}; }
    else if (i){ if (i.prev) i.status=i.prev; SL.notes[i.id]={err:d.error||SLT[ui].err}; }
    slRender();
  }
});

/* Say "ready" every second until the page answers — the page's listener may
   attach after this iframe loads, and a single message would be lost. */
let __answered = false;
window.addEventListener("message", e => { if (e.data && e.data.type === "3orsna:dash") __answered = true; });
(function ping(n){
  if (__answered) return;
  try{ window.parent.postMessage({type:"3orsna:dashReady"}, "*"); }catch(e){}
  if (n < 30) setTimeout(() => ping(n + 1), 1000);
})(0);

</script>

<!-- Pixel Pals iframe auto-height reporter v3 (body is the scroll box).
     Scrolls inside the iframe until the site-wide listener sizes it.
     Once the site-wide listener sizes the iframe, there is nothing left to scroll. -->
<script>
(function () {
  if (window.__ppReporter) return;
  window.__ppReporter = true;

  var s = document.createElement('style');
  s.textContent =
    'html{height:100%!important;min-height:0!important;overflow:hidden!important}' +
    'body{height:100%!important;min-height:0!important;margin:0;overflow-x:hidden!important;overflow-y:auto!important;' +
      '-webkit-overflow-scrolling:touch;overscroll-behavior:auto;scrollbar-width:none;-ms-overflow-style:none;display:flow-root}' +
    'html::-webkit-scrollbar,body::-webkit-scrollbar{width:0;height:0;display:none}';
  document.head.appendChild(s);

  var body = document.body, last = -1, raf = 0;

  // Height of the content itself, not the scroll box (so the iframe can shrink as well as grow)
  function measure() {
    var top = body.getBoundingClientRect().top - body.scrollTop;
    var bottom = 0, kids = body.children;
    for (var i = 0; i < kids.length; i++) {
      var r = kids[i].getBoundingClientRect();
      if (!r.height && !r.width) continue; // hidden, scripts, styles
      var mb = parseFloat(getComputedStyle(kids[i]).marginBottom) || 0;
      bottom = Math.max(bottom, r.bottom + mb);
    }
    var pb = parseFloat(getComputedStyle(body).paddingBottom) || 0;
    return Math.ceil(bottom - top + pb);
  }

  function send(force) {
    var h = measure();
    if (!force && h === last) return;
    last = h;
    window.parent.postMessage({ type: 'setHeight', height: h }, '*');
  }

  function schedule() {
    if (raf) return;
    raf = requestAnimationFrame(function () { raf = 0; send(false); });
  }

  // Watch the content (the body itself is now a fixed-size scroll box)
  var ro = 'ResizeObserver' in window ? new ResizeObserver(schedule) : null;
  function watchKids() {
    if (!ro) return;
    ro.observe(body);
    for (var i = 0; i < body.children.length; i++) ro.observe(body.children[i]);
  }
  watchKids();
  if ('MutationObserver' in window) {
    new MutationObserver(function () { watchKids(); schedule(); })
      .observe(body, { childList: true, subtree: true, attributes: true, characterData: true });
  }
  window.addEventListener('resize', schedule);
  window.addEventListener('load', function () { send(true); });
  document.addEventListener('load', schedule, true);
  document.addEventListener('transitionend', schedule, true);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { send(true); });

  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'requestHeight') send(true);
  });

  [0, 300, 1000, 2500, 5000].forEach(function (t) { setTimeout(function () { send(true); }, t); });
})();
</script>
